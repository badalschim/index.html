<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PCS Invoice</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; font-size: 14px; min-height: 100vh; }

/* ── LOGIN ── */
#screen-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-card {
  background: #fff; border-radius: 14px; padding: 2.5rem 2rem; width: 100%; max-width: 380px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.10);
}
.login-logo { text-align: center; margin-bottom: 1.5rem; }
.login-logo .logo-title { font-size: 20px; font-weight: 700; color: #1a3a8f; }
.login-logo .logo-sub { font-size: 12px; color: #888; margin-top: 2px; }
.login-card h2 { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 1.25rem; text-align: center; }
.field { margin-bottom: 14px; }
.field label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; font-weight: 600; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: Arial; outline: none; }
.field input:focus { border-color: #1a3a8f; }
.login-btn {
  width: 100%; padding: 12px; background: #1a3a8f; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Arial; margin-top: 6px;
}
.login-btn:hover { background: #153070; }
.login-btn:disabled { background: #aaa; cursor: not-allowed; }
.login-err { color: #c00; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
.login-loading { color: #888; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

/* ── APP ── */
#screen-app { display: none; background: #f0f2f5; min-height: 100vh; padding: 16px; }
.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.app-header .welcome { font-size: 13px; color: #555; }
.app-header .welcome strong { color: #1a3a8f; }
.logout-btn { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #555; cursor: pointer; font-family: Arial; }
.logout-btn:hover { background: #f5f5f5; }

.section { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
.sec-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
label { font-size: 11px; color: #666; display: block; margin-bottom: 3px; }
label .req { color: #c00; margin-left: 2px; }
input[type=text], input[type=date], input[type=number], select, textarea {
  width: 100%; font-family: Arial; font-size: 13px; padding: 7px 9px;
  border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: #555; }
textarea { resize: vertical; }
.model-tag { display: inline-block; font-size: 11px; padding: 3px 12px; border-radius: 20px; background: #e8f0fe; color: #1a56c4; font-weight: 700; margin-bottom: 1rem; }
.day-block { border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.day-name { font-size: 14px; font-weight: 700; color: #222; }
.day-sum { font-size: 13px; font-weight: 700; color: #1a56c4; }
.col-heads { display: grid; gap: 6px; margin-bottom: 4px; }
.col-heads span { font-size: 10px; color: #888; font-weight: 700; }
.house-row { display: grid; gap: 6px; margin-bottom: 4px; align-items: center; }
.house-row input { font-size: 12px; padding: 5px 8px; }
.ri { text-align: right; }
.add-btn { background: none; border: 1.5px dashed #ccc; border-radius: 6px; padding: 5px 10px; font-size: 12px; color: #888; cursor: pointer; margin-top: 4px; }
.add-btn:hover { background: #f5f5f5; }
.driver-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.driver-row label { white-space: nowrap; margin: 0; font-size: 11px; }
.driver-row select { width: auto; min-width: 100px; }
.pct-readonly { background: #f5f5f5 !important; color: #666 !important; }
.total-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: #f5f7ff; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #d0d8f0; }
.total-label { font-size: 14px; color: #555; }
.total-value { font-size: 24px; font-weight: 700; color: #1a3a8f; }
.gen-btn { width: 100%; padding: 13px; background: #1a3a8f; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Arial; }
.gen-btn:hover { background: #153070; }
.err-msg { color: #c00; font-size: 12px; margin-bottom: 10px; display: none; padding: 8px 12px; background: #fff0f0; border-radius: 6px; border: 1px solid #fcc; }
@media (max-width: 480px) {
  .g2, .g3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-title">Paula's Cleaning Squad</div>
      <div class="logo-sub">Sistema de Invoice</div>
    </div>
    <h2>Entrar</h2>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="Seu usuário" autocomplete="username" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-loading" id="login-loading">Verificando...</div>
  </div>
</div>

<!-- ── APP SCREEN ── -->
<div id="screen-app">
  <div class="app-header">
    <span class="welcome">Olá, <strong id="user-name"></strong></span>
    <button class="logout-btn" onclick="doLogout()">Sair</button>
  </div>

  <div id="model-tag-el" class="model-tag"></div>
  <div id="err-msg" class="err-msg">Preencha todos os campos obrigatórios (*) antes de gerar o PDF.</div>

  <div class="section">
    <div class="sec-title">Informações gerais</div>
    <div class="g2">
      <div><label>Seu nome (Account Name)<span class="req">*</span></label><input type="text" id="acct" placeholder="Seu nome" /></div>
      <div><label>Número Zelle<span class="req">*</span></label><input type="text" id="zelle" placeholder="000 000 0000" /></div>
    </div>
    <div class="g2">
      <div><label>Banco<span class="req">*</span></label><input type="text" id="bank" placeholder="Ex: Bank of America" /></div>
      <div><label>Data de emissão<span class="req">*</span></label><input id="date_issue" type="date" /></div>
    </div>
    <div class="g2">
      <div><label>Período início<span class="req">*</span></label><input id="date_start" type="date" /></div>
      <div><label>Período fim<span class="req">*</span></label><input id="date_end" type="date" /></div>
    </div>
    <div><label>Observação</label><textarea id="obs" rows="2" placeholder="Ex: Domingo 26/04 casa da Praia"></textarea></div>
  </div>

  <div class="section">
    <div class="sec-title">Dias trabalhados</div>
    <div id="days-container"></div>
  </div>

  <div class="total-bar">
    <span class="total-label">Total geral</span>
    <span class="total-value" id="grand-total">$0.00</span>
  </div>
  <button class="gen-btn" onclick="generatePDF()">⬇ Gerar e baixar PDF</button>
</div>

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let currentModel = 0;
let currentUser = '';

// ── LOGIN ──
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const errEl = document.getElementById('login-err');
  const loadEl = document.getElementById('login-loading');
  const btn = document.getElementById('login-btn');

  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  btn.disabled = true;
  loadEl.style.display = 'block';

  try {
    const url = `${SCRIPT_URL}?usuario=${encodeURIComponent(user)}&senha=${encodeURIComponent(pass)}`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.ok) {
      currentUser = json.nome || user;
      currentModel = json.modelo === '1' || json.modelo === 1 ? 1 : 2;
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-app').style.display = 'block';
      document.getElementById('user-name').textContent = currentUser;
      document.getElementById('model-tag-el').textContent = currentModel === 1 ? 'Modelo: 70% do valor da casa' : 'Modelo: Diária (valor manual)';
      buildDays();
    } else {
      errEl.textContent = 'Usuário ou senha incorretos.';
    }
  } catch(e) {
    errEl.textContent = 'Erro de conexão. Tente novamente.';
  }

  btn.disabled = false;
  loadEl.style.display = 'none';
}

function doLogout() {
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('days-container').innerHTML = '';
  document.getElementById('grand-total').textContent = '$0.00';
}

// ── FORM ──
function buildDays() {
  const c = document.getElementById('days-container');
  c.innerHTML = '';
  DAYS.forEach(day => {
    const d = document.createElement('div');
    d.className = 'day-block';
    if (currentModel === 1) {
      d.innerHTML = `
        <div class="day-header">
          <span class="day-name">${day}</span>
          <span class="day-sum" id="sum-${day}">$0.00</span>
        </div>
        <div class="col-heads" style="grid-template-columns:1fr 105px 90px">
          <span>Casa / Cliente</span><span style="text-align:right">Valor casa ($)</span><span style="text-align:right">Seu 70%</span>
        </div>
        <div id="houses-${day}"></div>
        <button class="add-btn" onclick="addHouse('${day}')">+ Casa</button>`;
    } else {
      d.innerHTML = `
        <div class="day-header">
          <span class="day-name">${day}</span>
          <span class="day-sum" id="sum-${day}"></span>
        </div>
        <div class="col-heads" style="grid-template-columns:1fr"><span>Casas do dia</span></div>
        <div id="houses-${day}"></div>
        <button class="add-btn" onclick="addHouse('${day}')">+ Casa</button>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
          <div style="flex:1;min-width:120px"><label>Total do dia ($)</label><input type="number" id="total-${day}" step="0.01" min="0" placeholder="0.00" oninput="calcDayM2('${day}')" /></div>
          <div class="driver-row" style="margin-top:0">
            <label>Driver/Helper:</label>
            <select id="driver-${day}"><option>Driver</option><option>Helper</option><option>—</option></select>
          </div>
        </div>`;
    }
    c.appendChild(d);
    addHouse(day);
  });
}

function addHouse(day) {
  const c = document.getElementById('houses-'+day);
  const row = document.createElement('div');
  row.className = 'house-row';
  if (currentModel === 1) {
    row.style.gridTemplateColumns = '1fr 105px 90px';
    row.innerHTML = `
      <input type="text" placeholder="Nome da casa/cliente" />
      <input class="ri" type="number" step="0.01" min="0" placeholder="0.00" oninput="calcDayM1('${day}')" />
      <input class="ri pct-readonly" readonly placeholder="—" />`;
  } else {
    row.style.gridTemplateColumns = '1fr';
    row.innerHTML = `<input type="text" placeholder="Nome da casa/cliente" />`;
  }
  c.appendChild(row);
}

function calcDayM1(day) {
  const rows = document.querySelectorAll('#houses-'+day+' .house-row');
  let sum = 0;
  rows.forEach(r => {
    const inputs = r.querySelectorAll('input');
    const hv = parseFloat(inputs[1].value)||0;
    const mv = hv * 0.7;
    inputs[2].value = mv > 0 ? mv.toFixed(2) : '';
    sum += mv;
  });
  document.getElementById('sum-'+day).textContent = '$'+sum.toFixed(2);
  calcGrand();
}

function calcDayM2(day) {
  const v = parseFloat(document.getElementById('total-'+day).value)||0;
  document.getElementById('sum-'+day).textContent = v > 0 ? '$'+v.toFixed(2) : '';
  calcGrand();
}

function calcGrand() {
  let t = 0;
  DAYS.forEach(d => {
    const el = document.getElementById('sum-'+d);
    t += parseFloat((el ? el.textContent : '').replace('$',''))||0;
  });
  document.getElementById('grand-total').textContent = '$'+t.toFixed(2);
}

function validateForm() {
  const required = ['acct','zelle','bank','date_issue','date_start','date_end'];
  for (const id of required) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return false;
  }
  return true;
}

function getDayData(day) {
  const rows = document.querySelectorAll('#houses-'+day+' .house-row');
  const houses = [];
  const driver = currentModel===2 ? ((document.getElementById('driver-'+day)||{}).value||'Driver') : 'Driver';
  if (currentModel === 1) {
    rows.forEach(r => {
      const inputs = r.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const hv = parseFloat(inputs[1].value)||0;
      const mv = hv * 0.7;
      if (name || hv) houses.push({name, hv, mv});
    });
    return {houses, total: houses.reduce((s,h)=>s+h.mv,0), driver};
  } else {
    rows.forEach(r => {
      const name = r.querySelector('input').value.trim();
      if (name) houses.push({name});
    });
    return {houses, total: parseFloat((document.getElementById('total-'+day)||{}).value)||0, driver};
  }
}

function generatePDF() {
  if (!validateForm()) {
    document.getElementById('err-msg').style.display = 'block';
    window.scrollTo(0,0);
    return;
  }
  document.getElementById('err-msg').style.display = 'none';

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const W=595, M=50;
  let y=40;

  try { doc.addImage('data:image/png;base64,'+LOGO_B64,'PNG',M,y,60,60); } catch(e){}

  doc.setFont('helvetica','normal'); doc.setFontSize(36); doc.setTextColor(50,50,50);
  doc.setCharSpace(8); doc.text("INVOICE", W-M, y+30, {align:'right'}); doc.setCharSpace(0);
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(50,50,50);
  doc.text("Paula's", M+68, y+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
  doc.text("Cleaning Squad", M+68, y+30);

  y+=80;
  doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(40,40,40); doc.text("ISSUED TO:", M, y);
  doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  y+=14; doc.text("Paula's Cleaning Squad", M, y);
  y+=13; doc.text("2456 Deercroft Drive, 32940", M, y);
  y+=16; doc.setFont('helvetica','bold'); doc.setTextColor(40,40,40); doc.text("PAY TO:", M, y);
  doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  y+=14; doc.text(document.getElementById('bank').value, M, y);
  y+=13; doc.text("Account Name: "+document.getElementById('acct').value, M, y);
  y+=13; doc.text("Zelle Number.: "+document.getElementById('zelle').value, M, y);

  const baseY=y-55, di=document.getElementById('date_issue').value, ds=document.getElementById('date_start').value, de=document.getElementById('date_end').value;
  doc.setFont('helvetica','bold'); doc.setTextColor(40,40,40);
  doc.text("DATE:", W-200, baseY); doc.text("DUE DATE:", W-200, baseY+16);
  doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  doc.text(di, W-M, baseY, {align:'right'});
  doc.text(ds+" a", W-M, baseY+16, {align:'right'});
  doc.text(de, W-M, baseY+30, {align:'right'});

  y+=20;
  doc.setDrawColor(180,180,180); doc.line(M,y,W-M,y); y+=14;
  const C={day:M, houses:M+160, driver:M+270, total:W-M};
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(40,40,40);
  doc.text("DAYS WORKED",C.day,y); doc.text("HOUSES",C.houses,y);
  doc.text("DRIVER/HELPER",C.driver,y); doc.text("TOTAL",C.total,y,{align:'right'});
  y+=8; doc.line(M,y,W-M,y); y+=14;

  let grand=0;
  DAYS.forEach(day=>{
    const {houses,total,driver}=getDayData(day);
    if(!houses.length && total===0) return;
    grand+=total;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(30,30,30); doc.text(day,C.day,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(70,70,70);
    doc.text(String(houses.length),C.houses,y); doc.text(driver,C.driver,y);
    if(total>0){doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);doc.text('$'+total.toFixed(2),C.total,y,{align:'right'});}
    y+=14;
    houses.forEach(h=>{
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,100);
      doc.text(h.name||'—',C.day+12,y);
      if(currentModel===1&&h.hv){doc.text('$'+h.hv.toFixed(2),C.houses+10,y);doc.setTextColor(30,30,30);doc.text('$'+h.mv.toFixed(2),C.total,y,{align:'right'});}
      y+=12;
    });
    y+=6;
    if(y>780){doc.addPage();y=50;}
  });

  doc.setDrawColor(180,180,180); doc.line(M,y,W-M,y); y+=14;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(30,30,30);
  doc.text("TOTAL",M,y); doc.text('$'+grand.toFixed(2),C.total,y,{align:'right'});

  const obs=document.getElementById('obs').value.trim();
  if(obs){y+=20;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(60,60,60);obs.split('\n').forEach(l=>{doc.text(l,M,y);y+=13;});}

  doc.save(currentModel===1?'invoice-70pct.pdf':'invoice-diaria.pdf');
}
</script>
</body>
</html>
