<style>
:root { --blue:#1a3a8f; --blue2:#2f5bd8; --bg:#f3f5fb; --card:#fff; --txt:#1b2233; --mut:#7a8399; --ok:#1f9d55; --bad:#d64545; --warn:#e29a16; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; min-height: 100vh; padding-top: env(safe-area-inset-top); }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #1a3a8f; z-index: 1000; }
.wrap { max-width: 760px; margin: 0 auto; padding-bottom: 40px; }
.hero { background: linear-gradient(160deg, var(--blue) 0%, var(--blue2) 100%); color: #fff; padding: 16px 18px 78px; border-radius: 0 0 30px 30px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; }
.lang { display: flex; gap: 2px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px; }
.lang button { border: none; background: none; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-size: 11px; font-weight: 700; color: #fff; font-family: inherit; }
.lang button.active { background: #fff; color: var(--blue); }
.hero h1 { font-size: 22px; font-weight: 800; margin-top: 20px; }
.hero p { font-size: 13px; opacity: .85; margin-top: 4px; }

.tabs { display: flex; gap: 4px; background: #fff; border-radius: 999px; padding: 4px; margin: -30px 16px 16px; box-shadow: 0 6px 18px rgba(26,58,143,.12); position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 50; }
.tab { flex: 1; border: none; background: none; padding: 11px 2px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--mut); cursor: pointer; font-family: inherit; transition: all .15s; }
.tab.on { background: var(--blue); color: #fff; }
.panel { display: none; padding: 0 16px; animation: up .3s; }
.panel.on { display: block; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 18px; padding: 14px 8px; text-align: center; box-shadow: 0 4px 14px rgba(26,58,143,.07); }
.stat .n { font-size: 24px; font-weight: 800; }
.stat .l { font-size: 11px; color: var(--mut); margin-top: 2px; font-weight: 600; }

.card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(26,58,143,.07); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; }
.day-name { font-weight: 800; font-size: 15px; text-transform: capitalize; }
.day-date { color: var(--mut); font-size: 12px; font-weight: 600; margin-left: 6px; }
.day-count { font-size: 12px; font-weight: 700; color: var(--ok); }
.bar { height: 8px; border-radius: 99px; background: #fbe3e3; margin: 10px 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .6s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.chip.bad { background: #fdecec; color: #b32323; }
.chip.ok { background: #e9f8ef; color: #17683a; }
.chip.warn { background: #fff3d6; color: #8a5a00; }
.all-ok { font-size: 12px; color: var(--ok); font-weight: 700; }
.sec-t { font-size: 13px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .4px; margin: 18px 4px 8px; }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: 0 0 auto; border: 1.5px solid #dfe4f1; background: #fff; color: #4a5470; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
.wk.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 14px; }

.item { display: flex; align-items: center; gap: 12px; }
.qty { min-width: 44px; height: 44px; border-radius: 14px; background: #e8efff; color: var(--blue); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 14px; }
.item-who { font-size: 12px; color: var(--mut); margin-top: 2px; }
.item-bar { height: 5px; border-radius: 99px; background: #eef1fa; margin-top: 7px; overflow: hidden; }
.item-bar i { display: block; height: 100%; background: var(--blue2); border-radius: 99px; }
.cart { text-decoration: none; font-size: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f1f4fb; }

.fb-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.fb-client { font-weight: 800; }
.fb-meta { font-size: 12px; color: var(--mut); margin-top: 2px; }
.score { background: #fff4d6; color: #7a5a00; font-weight: 800; border-radius: 12px; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
.fb-sub { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.fb-sub span { font-size: 11px; font-weight: 700; background: #f1f4fb; color: #4a5470; border-radius: 999px; padding: 4px 10px; }
.fb-com { margin-top: 10px; font-size: 14px; color: #3a4258; line-height: 1.5; background: #f8f9fd; border-radius: 12px; padding: 10px 12px; }
.refresh { display: block; margin: 8px auto 0; background: none; border: none; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; padding: 10px; }
.skeleton { height: 90px; border-radius: 20px; margin-bottom: 12px; background: linear-gradient(90deg,#e9edf6 25%,#f4f6fb 50%,#e9edf6 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.center { text-align: center; padding: 60px 24px; }
.center p { color: var(--mut); margin: 10px 0 18px; }

.alert { border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; margin-bottom: 8px; }
.alert a { color: inherit; font-weight: 800; margin-left: 6px; white-space: nowrap; }
.alert.warn { background: #fff3d6; color: #6b4a00; }
.alert.bad { background: #fdecec; color: #9b1c1c; }
.alert.good { background: #e9f8ef; color: #17683a; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-d { text-align: center; background: #f4f6fc; border-radius: 12px; padding: 8px 2px; }
.cal-d.low { background: #fdecec; }
.cw { font-size: 11px; font-weight: 800; color: var(--mut); text-transform: capitalize; }
.cn { font-size: 20px; font-weight: 800; margin: 2px 0; }
.cs { font-size: 10px; color: var(--mut); }
.cb { height: 34px; display: flex; align-items: flex-end; margin: 6px 6px 0; background: #e6eaf5; border-radius: 6px; overflow: hidden; }
.cb i { display: block; width: 100%; background: var(--ok); border-radius: 6px; }
.cal-d.low .cb i { background: var(--bad); }
.rk { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #eef1f8; }
.rk:last-child { border-bottom: none; }
.rk-n { flex: 1; font-weight: 700; font-size: 14px; min-width: 0; }
.rk-c { font-size: 12px; color: var(--mut); }
.filters { margin-bottom: 12px; }
.filters input, .filters select { width: 100%; padding: 11px 12px; border: 1.5px solid #dfe4f1; border-radius: 14px; font-size: 14px; font-family: inherit; background: #fff; color: var(--txt); outline: none; }
.frow { display: flex; gap: 8px; margin-top: 8px; }
.fcount { font-size: 12px; color: var(--mut); margin: 8px 4px 0; font-weight: 600; }
</style>
<script>(function(K){try{var s=JSON.parse(localStorage.getItem('pcs_session'));if(!s||!s.token||s.expires<Date.now()){location.replace('app.html');return;}if(K&&s.ocultas&&s.ocultas.indexOf(K)!==-1)location.replace('app.html');}catch(e){location.replace('app.html');}})(null);</script>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div class="hero">
    <div class="hero-top">
      <a class="pill" id="back-link" href="app.html" data-i18n="back">‹ Menu</a>
      <div class="lang">
        <button data-lang-btn="pt" onclick="setLang('pt')">PT</button>
        <button data-lang-btn="en" onclick="setLang('en')">EN</button>
        <button data-lang-btn="es" onclick="setLang('es')">ES</button>
      </div>

  <div class="tabs">

    <button class="tab" data-tab="fb" onclick="showTab('fb')" data-i18n="tab_fb">Feedbacks</button>

  <div class="panel on" id="p-resumo"><div class="skeleton"></div><div class="skeleton"></div></div>
  <div class="panel" id="p-escala"><div class="skeleton"></div><div class="skeleton"></div></div>
  <div class="panel" id="p-mat"></div>

</div>

<div class="center" id="nosession" style="display:none">
  <h2 data-i18n="need_login">Entre pelo menu primeiro</h2>
  <p data-i18n="need_login_s">Faça login para ver o painel.</p>
  <a class="pill" style="background:#1a3a8f" href="app.html" data-i18n="go_menu">Ir ao menu</a>
</div>

  <h2 data-i18n="no_perm">Sem permissão</h2>
  <p data-i18n="no_perm_s">Você não tem acesso a esta página.</p>
  <a class="pill" style="background:#1a3a8f" href="app.html" data-i18n="go_menu">Ir ao menu</a>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";

const TR = {
  pt: { by_item:'Por item', by_person:'Por pessoa', carried:'de semanas anteriores', st_comprado:'Comprado', st_estoque:'Estoque', st_enviado:'Enviado', late_sub:'Não enviado no resumo (semana atrasada)', future_sub:'Pedidos de domingo: entram na compra seguinte', next_cycle:'Próxima', open_week:'A comprar no domingo', closed_week:'Comprado em', open_sub:'Pedidos de segunda a sábado: comprar no domingo e distribuir na segunda', last5_sub:'Últimos 15 feedbacks', back:'‹ Menu', title:'Painel', week:'Escala da semana de', to:'a', tab_sched:'Escala', tab_sup:'Materiais', tab_fb:'Feedbacks', refresh:'↻ Atualizar',
    answered:'responderam', pending:'sem resposta', cant:'não trabalham', can:'trabalham', all_can:'Todas trabalham ✓', cant_label:'Não trabalha:', no_answer:'Ainda não responderam', notes:'Observações',
    sup_items:'itens', sup_orders:'pedidos', sup_title:'Materiais pedidos na semana', asked_by:'Pedido por', no_sup:'Nenhum pedido em aberto nesta semana.', no_fb:'Nenhum feedback ainda.',
    last5:'Últimos 15 feedbacks', punct:'Pontualidade', agil:'Agilidade', qual:'Qualidade', conn:'Erro de conexão. Toque em Atualizar.', no_days:'', hello:'Olá,',
    need_login:'Entre pelo menu primeiro', need_login_s:'Faça login para ver o painel.', go_menu:'Ir ao menu', no_perm:'Sem permissão', no_perm_s:'Você não tem acesso a esta página.', locale:'pt-BR', total:'total' },
  en: { by_item:'By item', by_person:'By person', carried:'from earlier weeks', st_comprado:'Bought', st_estoque:'In stock', st_enviado:'Sent', late_sub:'Not sent in the summary (late week)', future_sub:'Sunday requests: go to the following purchase', next_cycle:'Next', open_week:'To buy on Sunday', closed_week:'Bought on', open_sub:'Requests from Monday to Saturday: buy on Sunday, hand out on Monday', last5_sub:'Last 15 feedbacks', back:'‹ Menu', title:'Dashboard', week:'Schedule for week of', to:'to', tab_sched:'Schedule', tab_sup:'Supplies', tab_fb:'Feedback', refresh:'↻ Refresh',
    answered:'answered', pending:'no answer', cant:"not working", can:'working', all_can:'Everyone works ✓', cant_label:'Not working:', no_answer:'Not answered yet', notes:'Notes',
    sup_items:'items', sup_orders:'requests', sup_title:"This week's supply requests", asked_by:'Requested by', no_sup:'No open requests this week.', no_fb:'No feedback yet.',
    last5:'Last 15 feedbacks', punct:'Punctuality', agil:'Speed', qual:'Quality', conn:'Connection error. Tap Refresh.', no_days:'', hello:'Hi,',
    need_login:'Log in from the menu first', need_login_s:'Log in to see the dashboard.', go_menu:'Go to menu', no_perm:'No permission', no_perm_s:"You don't have access to this page.", locale:'en-US', total:'total' },
  es: { by_item:'Por artículo', by_person:'Por persona', carried:'de semanas anteriores', st_comprado:'Comprado', st_estoque:'En stock', st_enviado:'Enviado', late_sub:'No enviado en el resumen (semana atrasada)', future_sub:'Pedidos del domingo: van a la compra siguiente', next_cycle:'Próxima', open_week:'Para comprar el domingo', closed_week:'Comprado el', open_sub:'Pedidos de lunes a sábado: comprar el domingo y repartir el lunes', last5_sub:'Últimos 15 comentarios', back:'‹ Menú', title:'Panel', week:'Escala de la semana del', to:'al', tab_sched:'Escala', tab_sup:'Materiales', tab_fb:'Comentarios', refresh:'↻ Actualizar',
    answered:'respondieron', pending:'sin respuesta', cant:'no trabajan', can:'trabajan', all_can:'Todas trabajan ✓', cant_label:'No trabaja:', no_answer:'Aún no respondieron', notes:'Observaciones',
    sup_items:'ítems', sup_orders:'pedidos', sup_title:'Materiales pedidos en la semana', asked_by:'Pedido por', no_sup:'Ningún pedido abierto esta semana.', no_fb:'Aún no hay comentarios.',
    last5:'Últimos 15 comentarios', punct:'Puntualidad', agil:'Agilidad', qual:'Calidad', conn:'Error de conexión. Toca Actualizar.', no_days:'', hello:'Hola,',
    need_login:'Primero entra desde el menú', need_login_s:'Inicia sesión para ver el panel.', go_menu:'Ir al menú', no_perm:'Sin permiso', no_perm_s:'No tienes acceso a esta página.', locale:'es-ES', total:'total' }
};

Object.assign(TR.pt, { tab_sum:'Resumo', hero_sum:'Visão geral', alerts:'Atenção', all_good:'Tudo em dia ✓', al_noresp:'sem resposta da folga:', al_pend:'solicitação(ões) de alteração aguardando aprovação', al_carry:'item(ns) acumulado(s) de semanas anteriores', al_low:'Avaliação baixa:', kpi_resp:'Folgas enviadas', kpi_req:'Solicitações', kpi_buy:'Itens a comprar', kpi_avg:'Nota média', week_cal:'Quantas trabalham na semana', by_emp:'Avaliações por funcionária', fb_all:'Todas', fb_search:'Buscar cliente ou comentário', fb_pall:'Todo período', fb_30:'Últimos 30 dias', fb_90:'Últimos 90 dias', fb_more:'Mostrar mais', fb_n:'avaliações', open_disp:'Abrir solicitações ›', noeval:'Sem avaliações', ev:'aval.' });
Object.assign(TR.en, { tab_sum:'Summary', hero_sum:'Overview', alerts:'Attention', all_good:'All good ✓', al_noresp:'no days-off answer:', al_pend:'change request(s) waiting for approval', al_carry:'item(s) carried over from earlier weeks', al_low:'Low rating:', kpi_resp:'Days off sent', kpi_req:'Requests', kpi_buy:'Items to buy', kpi_avg:'Average score', week_cal:'How many work this week', by_emp:'Ratings by employee', fb_all:'Everyone', fb_search:'Search client or comment', fb_pall:'All time', fb_30:'Last 30 days', fb_90:'Last 90 days', fb_more:'Show more', fb_n:'reviews', open_disp:'Open requests ›', noeval:'No ratings', ev:'rev.' });
Object.assign(TR.es, { tab_sum:'Resumen', hero_sum:'Visión general', alerts:'Atención', all_good:'Todo al día ✓', al_noresp:'sin respuesta de libres:', al_pend:'solicitud(es) de cambio esperando aprobación', al_carry:'artículo(s) acumulado(s) de semanas anteriores', al_low:'Valoración baja:', kpi_resp:'Libres enviados', kpi_req:'Solicitudes', kpi_buy:'Artículos a comprar', kpi_avg:'Nota media', week_cal:'Cuántas trabajan en la semana', by_emp:'Valoraciones por empleada', fb_all:'Todas', fb_search:'Buscar cliente o comentario', fb_pall:'Todo el período', fb_30:'Últimos 30 días', fb_90:'Últimos 90 días', fb_more:'Mostrar más', fb_n:'valoraciones', open_disp:'Abrir solicitudes ›', noeval:'Sin valoraciones', ev:'val.' });

let lang = 'pt'; try { lang = localStorage.getItem('pcs_lang') || 'pt'; } catch(e) {}
let me = null, data = null, curTab = 'resumo', matSel = 'open';
let fbPer = '', fbQ = '', fbDias = 0, fbN = 15;
const t = k => (TR[lang] && TR[lang][k]) || TR.pt[k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function getSession() {
  try { const s = JSON.parse(localStorage.getItem('pcs_session')); if (s && s.user && s.token && s.expires > Date.now()) return s; } catch(e) {}
  return null;
}
function parseISO(i) { const [y, m, d] = i.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtShort(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function wd(d) { return d.toLocaleDateString(t('locale'), { weekday: 'long' }); }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang));
  document.documentElement.lang = lang;
  if (data) render(); else setHero();
}
function setLang(l) { lang = l; try { localStorage.setItem('pcs_lang', l); } catch(e) {} applyLang(); }
function setHero() {
  const titles = { resumo: t('tab_sum'), escala: t('tab_sched'), mat: t('tab_sup'), fb: t('tab_fb') };
  $('h-title').textContent = titles[curTab];
  if (!data) { $('sub').textContent = ''; return; }
  if (curTab === 'resumo') {
    const e = data.escala;
    $('sub').textContent = t('hero_sum') + ' · ' + t('week') + ' ' + fmtShort(parseISO(e.dias[0].iso)) + ' ' + t('to') + ' ' + fmtShort(parseISO(e.dias[6].iso));
  } else if (curTab === 'escala') {
    const e = data.escala, ini = parseISO(e.dias[0].iso), fim = parseISO(e.dias[6].iso);
    $('sub').textContent = t('week') + ' ' + fmtShort(ini) + ' ' + t('to') + ' ' + fmtShort(fim);
  } else if (curTab === 'mat') {
    const w = (data.semanasMat || []).find(x => x.semana === matSel);
    $('sub').textContent = matSel === 'open' ? t('open_sub') + ' (' + nextSunday() + ')' : (w && w.atrasado ? t('late_sub') + ' · ' : (w && w.futuro ? t('future_sub') + ' · ' : t('closed_week') + ' ')) + matSel.slice(0, 5).replace('-', '/');
  } else $('sub').textContent = t('last5_sub');
}

function showTab(n) {
  curTab = n;
  setHero();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + n));
  window.scrollTo({ top: 0 });
}

async function load() {
  ['p-resumo', 'p-escala', 'p-mat', 'p-fb'].forEach(id => $(id).innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>');
  try {
    const r = await fetch(SCRIPT_URL + '?action=dash&token=' + encodeURIComponent(me.token)).then(x => x.json());
    if (r.erro === 'auth') { location.replace('app.html'); return; }
    if (!r.ok) {
      $('app').style.display = 'none'; $('noperm').style.display = 'block'; return;
    }
    data = r; render();
  } catch(e) { ['p-resumo', 'p-escala', 'p-mat', 'p-fb'].forEach(id => $(id).innerHTML = `<div class="empty">${t('conn')}</div>`); }
}

function render() {
  renderResumo(); renderEscala(); renderMat(); renderFb(); setHero();
}

function renderEscala() {
  const e = data.escala;
  const ini = parseISO(e.dias[0].iso), fim = parseISO(e.dias[6].iso);
  const resp = e.total - e.semResposta.length;
  let h = `<div class="stats">
    <div class="stat"><div class="n" style="color:var(--ok)">${resp}/${e.total}</div><div class="l">${t('answered')}</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${e.semResposta.length}</div><div class="l">${t('pending')}</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${e.dias.reduce((a, d) => a + d.nao.length, 0)}</div><div class="l">${t('cant')} (${t('total')})</div></div>
  </div>`;
  h += e.dias.map(d => {
    const dt = parseISO(d.iso), total = d.pode.length + d.nao.length;
    const pct = total ? Math.round(d.pode.length / total * 100) : 0;
    return `<div class="card">
      <div class="day-head"><div><span class="day-name">${wd(dt)}</span><span class="day-date">${fmtShort(dt)}</span></div>
      <span class="day-count">${d.pode.length} ${t('can')}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${d.nao.length ? `<div class="chips"><span style="font-size:12px;color:var(--mut);align-self:center;font-weight:600">${t('cant_label')}</span>${d.nao.map(n => `<span class="chip bad">${esc(n)}</span>`).join('')}</div>` : (total ? `<div class="all-ok">${t('all_can')}</div>` : '')}
    </div>`;
  }).join('');
  if (e.semResposta.length) h += `<div class="sec-t">${t('no_answer')}</div><div class="card"><div class="chips">${e.semResposta.map(n => `<span class="chip warn">${esc(n)}</span>`).join('')}</div></div>`;
  if (e.obs.length) h += `<div class="sec-t">${t('notes')}</div><div class="card">${e.obs.map(o => `<div style="margin-bottom:8px"><b>${esc(o.nome)}:</b> ${esc(o.obs)}</div>`).join('')}</div>`;
  $('p-escala').innerHTML = h;
}

function nextSunday() { return data && data.compra ? fmtShort(parseISO(data.compra)) : ''; }
function matLabel(sm) { return sm.slice(0, 5).replace('-', '/'); }
let matView = 'item';
function setView(v) { matView = v; renderMat(); }
function selectWeek(k) { matSel = k; renderMat(); setHero(); }

function renderMat() {
  const weeks = data.semanasMat || [];
  if (matSel !== 'open' && !weeks.some(w => w.semana === matSel)) matSel = 'open';
  const m = matSel === 'open' ? data.materiais : weeks.find(w => w.semana === matSel).itens;
  let h = `<div class="weeks"><button class="wk${matSel === 'open' ? ' on' : ''}" onclick="selectWeek('open')">${t('open_week')} (${nextSunday()})</button>` +
    weeks.map(w => `<button class="wk${matSel === w.semana ? ' on' : ''}" onclick="selectWeek('${w.semana}')">${matLabel(w.semana)} · ${t('st_' + (w.status || 'enviado'))}</button>`).join('') + `</div>`;
  if (!m.length) { $('p-mat').innerHTML = h + `<div class="empty">🧺<br>${t('no_sup')}</div>`; return; }
  if (matSel === 'open') h += `<div class="weeks"><button class="wk${matView === 'item' ? ' on' : ''}" onclick="setView('item')">${t('by_item')}</button><button class="wk${matView === 'pessoa' ? ' on' : ''}" onclick="setView('pessoa')">${t('by_person')}</button></div>`;
  if (matSel === 'open' && matView === 'pessoa') {
    h += (data.porPessoa || []).map(p => `<div class="card"><div class="item-name" style="margin-bottom:8px">👤 ${esc(p.nome)}</div>` +
      p.itens.map(i => `<div class="item-who" style="font-size:13.5px;color:#1b2233;margin:3px 0">${i.qtd}x ${esc(i.nome)}${i.antigo ? ` <span style="color:#c0392b">⚠️ ${i.antigo} ${t('carried')}</span>` : ''}</div>`).join('') + `</div>`).join('');
    $('p-mat').innerHTML = h; return;
  }
  const max = Math.max(...m.map(i => i.quantidade));
  const total = m.reduce((a, i) => a + i.quantidade, 0);
  h += `<div class="stats" style="grid-template-columns:1fr 1fr">
    <div class="stat"><div class="n">${m.length}</div><div class="l">${t('sup_items')}</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">${t('sup_orders')}</div></div></div>`;
  h += m.map(i => `<div class="card item">
    <div class="qty">${i.quantidade}x</div>
    <div class="item-main"><div class="item-name">${esc(i.nome)}</div>
      <div class="item-who">${t('asked_by')}: ${esc(i.quem.join(', '))}${i.antigo ? ` · <span style="color:#c0392b">⚠️ ${i.antigo} ${t('carried')}</span>` : ''}</div>
      <div class="item-bar"><i style="width:${Math.round(i.quantidade / max * 100)}%"></i></div></div>
    ${i.link ? `<a class="cart" href="${esc(i.link)}" target="_blank" rel="noopener">🛒</a>` : ''}
  </div>`).join('');
  $('p-mat').innerHTML = h;
}

const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isNaN(n) ? null : n; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const f1 = n => n === null ? '—' : (Math.round(n * 10) / 10).toString().replace('.', lang === 'en' ? '.' : ',');
function pessoasDe(q) { return String(q || '').split(/\s*(?:,|&|\/|\se\s)\s*/).map(x => x.trim()).filter(Boolean); }

function renderResumo() {
  const e = data.escala, fb = data.feedbacks || [];
  const resp = e.total - e.semResposta.length;
  const pend = (data.solicPend || []);
  const compra = (data.materiais || []).reduce((a, i) => a + i.quantidade, 0);
  const carry = (data.materiais || []).reduce((a, i) => a + (i.antigo || 0), 0);
  const ult = fb.slice(0, 15);
  const media = avg(ult.map(x => num(x.nota)).filter(n => n !== null));
  const baixas = ult.filter(x => { const n = num(x.nota); return n !== null && n < 4; });

  let al = '';
  if (e.semResposta.length) al += `<div class="alert warn">⏳ <b>${e.semResposta.length}</b> ${t('al_noresp')} ${e.semResposta.map(esc).join(', ')}</div>`;
  if (pend.length) al += `<div class="alert warn">📝 <b>${pend.length}</b> ${t('al_pend')} (${pend.map(p => esc(p.nome)).join(', ')}) <a href="disponibilidade.html">${t('open_disp')}</a></div>`;
  if (carry) al += `<div class="alert bad">⚠️ <b>${carry}</b> ${t('al_carry')}</div>`;
  baixas.forEach(x => al += `<div class="alert bad">⭐ ${t('al_low')} <b>${esc(x.nota)}</b> · ${esc(x.cliente || '—')}${x.quem ? ' (' + esc(x.quem) + ')' : ''} · ${esc(x.data)}</div>`);
  if (!al) al = `<div class="alert good">${t('all_good')}</div>`;

  const kpi = `<div class="stats" style="grid-template-columns:1fr 1fr">
    <div class="stat"><div class="n" style="color:var(--ok)">${resp}/${e.total}</div><div class="l">${t('kpi_resp')}</div></div>
    <div class="stat"><div class="n" style="color:${pend.length ? 'var(--warn)' : 'var(--txt)'}">${pend.length}</div><div class="l">${t('kpi_req')}</div></div>
    <div class="stat"><div class="n" style="color:var(--blue)">${compra}</div><div class="l">${t('kpi_buy')}</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">★ ${f1(media)}</div><div class="l">${t('kpi_avg')}</div></div></div>`;

  const maxW = Math.max(1, ...e.dias.map(d => d.pode.length));
  const cal = `<div class="cal">${e.dias.map(d => {
    const dt = parseISO(d.iso), n = d.pode.length, total = n + d.nao.length;
    const low = total && d.nao.length > 0 && n / total < 0.7;
    return `<div class="cal-d${low ? ' low' : ''}"><div class="cw">${dt.toLocaleDateString(t('locale'), { weekday: 'short' }).replace('.', '')}</div><div class="cn">${n}</div><div class="cs">${fmtShort(dt)}</div><div class="cb"><i style="height:${Math.round(n / maxW * 100)}%"></i></div></div>`;
  }).join('')}</div>`;

  // por funcionária
  const m = {};
  fb.forEach(x => { const n = num(x.nota); if (n === null) return; pessoasDe(x.quem).forEach(p => { (m[p] = m[p] || []).push(n); }); });
  const ativos = data.ativos || null;
  const rank = Object.keys(m).filter(p => !ativos || ativos.indexOf(p) !== -1).map(p => {
    const a = m[p], rec = avg(a.slice(0, 5)), ant = a.length > 5 ? avg(a.slice(5, 10)) : null;
    const tr = ant === null ? '' : (rec - ant >= 0.3 ? '<span style="color:var(--ok)">↑</span>' : (rec - ant <= -0.3 ? '<span style="color:var(--bad)">↓</span>' : '<span style="color:var(--mut)">→</span>'));
    return { p, n: a.length, m: avg(a), tr };
  }).sort((x, y) => y.m - x.m);
  const emp = rank.length ? rank.map(r => `<div class="rk"><span class="rk-n">${esc(r.p)}</span><span class="rk-c">${r.n} ${t('ev')}</span><span class="score">★ ${f1(r.m)} ${r.tr}</span></div>`).join('') : `<div class="empty" style="padding:10px">${t('noeval')}</div>`;

  $('p-resumo').innerHTML = `<div class="sec-t" style="margin-top:4px">${t('alerts')}</div>${al}
    <div class="sec-t">${t('kpi_resp')} · ${t('kpi_buy')}</div>${kpi}
    <div class="sec-t">${t('week_cal')}</div><div class="card">${cal}</div>
    <div class="sec-t">${t('by_emp')}</div><div class="card">${emp}</div>`;
}

function fbFiltrados() {
  const f = data.feedbacks || [];
  const lim = fbDias ? new Date(Date.now() - fbDias * 86400000) : null;
  const q = fbQ.trim().toLowerCase();
  return f.filter(x => {
    if (fbPer && pessoasDe(x.quem).indexOf(fbPer) === -1) return false;
    if (lim && (!x.iso || parseISO(x.iso) < lim)) return false;
    if (q && (x.cliente + ' ' + x.comentario).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}
function fbSet(k, v) { if (k === 'per') fbPer = v; else if (k === 'dias') fbDias = +v; else fbQ = v; fbN = 15; renderFb(true); }
function fbMais() { fbN += 15; renderFb(true); }

function renderFb(keepFocus) {
  const f = data.feedbacks || [];
  if (!f.length) { $('p-fb').innerHTML = `<div class="empty">💬<br>${t('no_fb')}</div>`; return; }
  const pessoas = [...new Set(f.flatMap(x => pessoasDe(x.quem)))].sort();
  const lista = fbFiltrados(), vis = lista.slice(0, fbN);
  const filtros = `<div class="filters">
    <input id="fb-q" type="search" placeholder="${t('fb_search')}" value="${esc(fbQ)}" oninput="fbSet('q', this.value)" />
    <div class="frow"><select onchange="fbSet('per', this.value)"><option value="">${t('fb_all')}</option>${pessoas.map(p => `<option value="${esc(p)}"${p === fbPer ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select>
    <select onchange="fbSet('dias', this.value)"><option value="0">${t('fb_pall')}</option><option value="30"${fbDias === 30 ? ' selected' : ''}>${t('fb_30')}</option><option value="90"${fbDias === 90 ? ' selected' : ''}>${t('fb_90')}</option></select></div>
    <div class="fcount">${lista.length} ${t('fb_n')}</div></div>`;
  const cards = vis.map(x => `<div class="card">
    <div class="fb-top"><div><div class="fb-client">${esc(x.cliente || '—')}</div><div class="fb-meta">${esc(x.data)}${x.quem ? ' · ' + esc(x.quem) : ''}</div></div>
    ${x.nota ? `<div class="score">★ ${esc(x.nota)}</div>` : ''}</div>
    ${(x.punctuality || x.agility || x.quality) ? `<div class="fb-sub">${x.punctuality ? `<span>⏱ ${t('punct')}: ${esc(x.punctuality)}</span>` : ''}${x.agility ? `<span>⚡ ${t('agil')}: ${esc(x.agility)}</span>` : ''}${x.quality ? `<span>✨ ${t('qual')}: ${esc(x.quality)}</span>` : ''}</div>` : ''}
    ${x.comentario ? `<div class="fb-com">${esc(x.comentario)}</div>` : ''}
  </div>`).join('');
  const mais = lista.length > vis.length ? `<button class="wk" style="display:block;margin:6px auto" onclick="fbMais()">${t('fb_more')} (${lista.length - vis.length})</button>` : '';
  const had = keepFocus && document.activeElement && document.activeElement.id === 'fb-q';
  const pos = had ? document.activeElement.selectionStart : 0;
  $('p-fb').innerHTML = filtros + (cards || `<div class="empty">💬<br>${t('no_fb')}</div>`) + mais;
  if (had) { const el = $('fb-q'); el.focus(); try { el.setSelectionRange(pos, pos); } catch(e) {} }
}

window.addEventListener('DOMContentLoaded', () => {
  me = getSession();
  if (!me) { $('nosession').style.display = 'block'; applyLang(); return; }
  
  $('app').style.display = 'block';
  applyLang();
  load();
});
</script>
</body>
</html>
