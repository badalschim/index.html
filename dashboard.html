<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a3a8f" />
<title>Painel - Paula's Cleaning Squad</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PCS" />
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<style>
:root { --blue:#1a3a8f; --blue2:#2f5bd8; --bg:#f3f5fb; --card:#fff; --txt:#1b2233; --mut:#7a8399; --ok:#1f9d55; --bad:#d64545; --warn:#e29a16; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; min-height: 100vh; padding-top: env(safe-area-inset-top); }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #1a3a8f; z-index: 1000; }
.wrap { max-width: 760px; margin: 0 auto; padding-bottom: 40px; }
.hero { background: linear-gradient(160deg, var(--blue) 0%, var(--blue2) 100%); color: #fff; padding: 16px 18px 78px; border-radius: 0 0 30px 30px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; }
.lang { display: flex; gap: 2px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px; }
.lang button { border: none; background: none; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-size: 11px; font-weight: 700; color: #fff; font-family: inherit; }
.lang button.active { background: #fff; color: var(--blue); }
.hero h1 { font-size: 22px; font-weight: 800; margin-top: 20px; }
.hero p { font-size: 13px; opacity: .85; margin-top: 4px; }

.tabs { display: flex; gap: 4px; background: #fff; border-radius: 999px; padding: 4px; margin: -30px 16px 16px; box-shadow: 0 6px 18px rgba(26,58,143,.12); position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 50; }
.tab { flex: 1; border: none; background: none; padding: 11px 6px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--mut); cursor: pointer; font-family: inherit; transition: all .15s; }
.tab.on { background: var(--blue); color: #fff; }
.panel { display: none; padding: 0 16px; animation: up .3s; }
.panel.on { display: block; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 18px; padding: 14px 8px; text-align: center; box-shadow: 0 4px 14px rgba(26,58,143,.07); }
.stat .n { font-size: 24px; font-weight: 800; }
.stat .l { font-size: 11px; color: var(--mut); margin-top: 2px; font-weight: 600; }

.card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(26,58,143,.07); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; }
.day-name { font-weight: 800; font-size: 15px; text-transform: capitalize; }
.day-date { color: var(--mut); font-size: 12px; font-weight: 600; margin-left: 6px; }
.day-count { font-size: 12px; font-weight: 700; color: var(--ok); }
.bar { height: 8px; border-radius: 99px; background: #fbe3e3; margin: 10px 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .6s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.chip.bad { background: #fdecec; color: #b32323; }
.chip.ok { background: #e9f8ef; color: #17683a; }
.chip.warn { background: #fff3d6; color: #8a5a00; }
.all-ok { font-size: 12px; color: var(--ok); font-weight: 700; }
.sec-t { font-size: 13px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .4px; margin: 18px 4px 8px; }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: 0 0 auto; border: 1.5px solid #dfe4f1; background: #fff; color: #4a5470; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
.wk.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 14px; }

.item { display: flex; align-items: center; gap: 12px; }
.qty { min-width: 44px; height: 44px; border-radius: 14px; background: #e8efff; color: var(--blue); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 14px; }
.item-who { font-size: 12px; color: var(--mut); margin-top: 2px; }
.item-bar { height: 5px; border-radius: 99px; background: #eef1fa; margin-top: 7px; overflow: hidden; }
.item-bar i { display: block; height: 100%; background: var(--blue2); border-radius: 99px; }
.cart { text-decoration: none; font-size: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f1f4fb; }

.fb-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.fb-client { font-weight: 800; }
.fb-meta { font-size: 12px; color: var(--mut); margin-top: 2px; }
.score { background: #fff4d6; color: #7a5a00; font-weight: 800; border-radius: 12px; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
.fb-sub { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.fb-sub span { font-size: 11px; font-weight: 700; background: #f1f4fb; color: #4a5470; border-radius: 999px; padding: 4px 10px; }
.fb-com { margin-top: 10px; font-size: 14px; color: #3a4258; line-height: 1.5; background: #f8f9fd; border-radius: 12px; padding: 10px 12px; }
.refresh { display: block; margin: 8px auto 0; background: none; border: none; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; padding: 10px; }
.skeleton { height: 90px; border-radius: 20px; margin-bottom: 12px; background: linear-gradient(90deg,#e9edf6 25%,#f4f6fb 50%,#e9edf6 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.center { text-align: center; padding: 60px 24px; }
.center p { color: var(--mut); margin: 10px 0 18px; }
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div class="hero">
    <div class="hero-top">
      <a class="pill" id="back-link" href="menu-teste.html" data-i18n="back">‹ Menu</a>
      <div class="lang">
        <button data-lang-btn="pt" onclick="setLang('pt')">PT</button>
        <button data-lang-btn="en" onclick="setLang('en')">EN</button>
        <button data-lang-btn="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
    <h1 id="h-title">Escala</h1>
    <p id="sub"></p>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="escala" onclick="showTab('escala')" data-i18n="tab_sched">Escala</button>
    <button class="tab" data-tab="mat" onclick="showTab('mat')" data-i18n="tab_sup">Materiais</button>
    <button class="tab" data-tab="fb" onclick="showTab('fb')" data-i18n="tab_fb">Feedbacks</button>
  </div>

  <div class="panel on" id="p-escala"><div class="skeleton"></div><div class="skeleton"></div></div>
  <div class="panel" id="p-mat"></div>
  <div class="panel" id="p-fb"></div>
  <button class="refresh" onclick="load()" data-i18n="refresh">↻ Atualizar</button>
</div>

<div class="center" id="nosession" style="display:none">
  <h2 data-i18n="need_login">Entre pelo menu primeiro</h2>
  <p data-i18n="need_login_s">Faça login para ver o painel.</p>
  <a class="pill" style="background:#1a3a8f" href="menu-teste.html" data-i18n="go_menu">Ir ao menu</a>
</div>
<div class="center" id="noperm" style="display:none">
  <h2 data-i18n="no_perm">Sem permissão</h2>
  <p data-i18n="no_perm_s">Você não tem acesso a esta página.</p>
  <a class="pill" style="background:#1a3a8f" href="menu-teste.html" data-i18n="go_menu">Ir ao menu</a>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";

const TR = {
  pt: { late_sub:'Não enviado no resumo (semana atrasada)', future_sub:'Pedidos de domingo: entram na compra seguinte', next_cycle:'Próxima', open_week:'A comprar no domingo', closed_week:'Comprado em', open_sub:'Pedidos de segunda a sábado: comprar no domingo e distribuir na segunda', last5_sub:'Últimos 5 feedbacks', back:'‹ Menu', title:'Painel', week:'Escala da semana de', to:'a', tab_sched:'Escala', tab_sup:'Materiais', tab_fb:'Feedbacks', refresh:'↻ Atualizar',
    answered:'responderam', pending:'sem resposta', cant:'não trabalham', can:'trabalham', all_can:'Todas trabalham ✓', cant_label:'Não trabalha:', no_answer:'Ainda não responderam', notes:'Observações',
    sup_items:'itens', sup_orders:'pedidos', sup_title:'Materiais pedidos na semana', asked_by:'Pedido por', no_sup:'Nenhum pedido em aberto nesta semana.', no_fb:'Nenhum feedback ainda.',
    last5:'Últimos 5 feedbacks', punct:'Pontualidade', agil:'Agilidade', qual:'Qualidade', conn:'Erro de conexão. Toque em Atualizar.', no_days:'', hello:'Olá,',
    need_login:'Entre pelo menu primeiro', need_login_s:'Faça login para ver o painel.', go_menu:'Ir ao menu', no_perm:'Sem permissão', no_perm_s:'Você não tem acesso a esta página.', locale:'pt-BR', total:'total' },
  en: { late_sub:'Not sent in the summary (late week)', future_sub:'Sunday requests: go to the following purchase', next_cycle:'Next', open_week:'To buy on Sunday', closed_week:'Bought on', open_sub:'Requests from Monday to Saturday: buy on Sunday, hand out on Monday', last5_sub:'Last 5 feedbacks', back:'‹ Menu', title:'Dashboard', week:'Schedule for week of', to:'to', tab_sched:'Schedule', tab_sup:'Supplies', tab_fb:'Feedback', refresh:'↻ Refresh',
    answered:'answered', pending:'no answer', cant:"not working", can:'working', all_can:'Everyone works ✓', cant_label:'Not working:', no_answer:'Not answered yet', notes:'Notes',
    sup_items:'items', sup_orders:'requests', sup_title:"This week's supply requests", asked_by:'Requested by', no_sup:'No open requests this week.', no_fb:'No feedback yet.',
    last5:'Last 5 feedbacks', punct:'Punctuality', agil:'Speed', qual:'Quality', conn:'Connection error. Tap Refresh.', no_days:'', hello:'Hi,',
    need_login:'Log in from the menu first', need_login_s:'Log in to see the dashboard.', go_menu:'Go to menu', no_perm:'No permission', no_perm_s:"You don't have access to this page.", locale:'en-US', total:'total' },
  es: { late_sub:'No enviado en el resumen (semana atrasada)', future_sub:'Pedidos del domingo: van a la compra siguiente', next_cycle:'Próxima', open_week:'Para comprar el domingo', closed_week:'Comprado el', open_sub:'Pedidos de lunes a sábado: comprar el domingo y repartir el lunes', last5_sub:'Últimos 5 comentarios', back:'‹ Menú', title:'Panel', week:'Escala de la semana del', to:'al', tab_sched:'Escala', tab_sup:'Materiales', tab_fb:'Comentarios', refresh:'↻ Actualizar',
    answered:'respondieron', pending:'sin respuesta', cant:'no trabajan', can:'trabajan', all_can:'Todas trabajan ✓', cant_label:'No trabaja:', no_answer:'Aún no respondieron', notes:'Observaciones',
    sup_items:'ítems', sup_orders:'pedidos', sup_title:'Materiales pedidos en la semana', asked_by:'Pedido por', no_sup:'Ningún pedido abierto esta semana.', no_fb:'Aún no hay comentarios.',
    last5:'Últimos 5 comentarios', punct:'Puntualidad', agil:'Agilidad', qual:'Calidad', conn:'Error de conexión. Toca Actualizar.', no_days:'', hello:'Hola,',
    need_login:'Primero entra desde el menú', need_login_s:'Inicia sesión para ver el panel.', go_menu:'Ir al menú', no_perm:'Sin permiso', no_perm_s:'No tienes acceso a esta página.', locale:'es-ES', total:'total' }
};

let lang = 'pt'; try { lang = localStorage.getItem('pcs_lang') || 'pt'; } catch(e) {}
let me = null, data = null, curTab = 'escala', matSel = 'open';
const t = k => (TR[lang] && TR[lang][k]) || TR.pt[k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function getSession() {
  try { const s = JSON.parse(localStorage.getItem('pcs_session')); if (s && s.user && s.expires > Date.now()) return s; } catch(e) {}
  try { if (location.hash.length > 1) { const h = JSON.parse(atob(location.hash.slice(1))); if (h && h.user) return h; } } catch(e) {}
  return null;
}
function parseISO(i) { const [y, m, d] = i.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtShort(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function wd(d) { return d.toLocaleDateString(t('locale'), { weekday: 'long' }); }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang));
  document.documentElement.lang = lang;
  if (data) render(); else setHero();
}
function setLang(l) { lang = l; try { localStorage.setItem('pcs_lang', l); } catch(e) {} applyLang(); }
function setHero() {
  const titles = { escala: t('tab_sched'), mat: t('tab_sup'), fb: t('tab_fb') };
  $('h-title').textContent = titles[curTab];
  if (!data) { $('sub').textContent = ''; return; }
  if (curTab === 'escala') {
    const e = data.escala, ini = parseISO(e.dias[0].iso), fim = parseISO(e.dias[6].iso);
    $('sub').textContent = t('week') + ' ' + fmtShort(ini) + ' ' + t('to') + ' ' + fmtShort(fim);
  } else if (curTab === 'mat') {
    const w = (data.semanasMat || []).find(x => x.semana === matSel);
    $('sub').textContent = matSel === 'open' ? t('open_sub') + ' (' + nextSunday() + ')' : (w && w.atrasado ? t('late_sub') + ' · ' : (w && w.futuro ? t('future_sub') + ' · ' : t('closed_week') + ' ')) + matSel.slice(0, 5).replace('-', '/');
  } else $('sub').textContent = t('last5_sub');
}

function showTab(n) {
  curTab = n;
  setHero();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + n));
  window.scrollTo({ top: 0 });
}

async function load() {
  ['p-escala', 'p-mat', 'p-fb'].forEach(id => $(id).innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>');
  try {
    const r = await fetch(SCRIPT_URL + '?action=dash&usuario=' + encodeURIComponent(me.user)).then(x => x.json());
    if (!r.ok) {
      $('app').style.display = 'none'; $('noperm').style.display = 'block'; return;
    }
    data = r; render();
  } catch(e) { ['p-escala', 'p-mat', 'p-fb'].forEach(id => $(id).innerHTML = `<div class="empty">${t('conn')}</div>`); }
}

function render() {
  renderEscala(); renderMat(); renderFb(); setHero();
}

function renderEscala() {
  const e = data.escala;
  const ini = parseISO(e.dias[0].iso), fim = parseISO(e.dias[6].iso);
  const resp = e.total - e.semResposta.length;
  let h = `<div class="stats">
    <div class="stat"><div class="n" style="color:var(--ok)">${resp}/${e.total}</div><div class="l">${t('answered')}</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${e.semResposta.length}</div><div class="l">${t('pending')}</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${e.dias.reduce((a, d) => a + d.nao.length, 0)}</div><div class="l">${t('cant')} (${t('total')})</div></div>
  </div>`;
  h += e.dias.map(d => {
    const dt = parseISO(d.iso), total = d.pode.length + d.nao.length;
    const pct = total ? Math.round(d.pode.length / total * 100) : 0;
    return `<div class="card">
      <div class="day-head"><div><span class="day-name">${wd(dt)}</span><span class="day-date">${fmtShort(dt)}</span></div>
      <span class="day-count">${d.pode.length} ${t('can')}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${d.nao.length ? `<div class="chips"><span style="font-size:12px;color:var(--mut);align-self:center;font-weight:600">${t('cant_label')}</span>${d.nao.map(n => `<span class="chip bad">${esc(n)}</span>`).join('')}</div>` : (total ? `<div class="all-ok">${t('all_can')}</div>` : '')}
    </div>`;
  }).join('');
  if (e.semResposta.length) h += `<div class="sec-t">${t('no_answer')}</div><div class="card"><div class="chips">${e.semResposta.map(n => `<span class="chip warn">${esc(n)}</span>`).join('')}</div></div>`;
  if (e.obs.length) h += `<div class="sec-t">${t('notes')}</div><div class="card">${e.obs.map(o => `<div style="margin-bottom:8px"><b>${esc(o.nome)}:</b> ${esc(o.obs)}</div>`).join('')}</div>`;
  $('p-escala').innerHTML = h;
}

function nextSunday() { return data && data.compra ? fmtShort(parseISO(data.compra)) : ''; }
function matLabel(sm) { return sm.slice(0, 5).replace('-', '/'); }
function selectWeek(k) { matSel = k; renderMat(); setHero(); }

function renderMat() {
  const weeks = data.semanasMat || [];
  if (matSel !== 'open' && !weeks.some(w => w.semana === matSel)) matSel = 'open';
  const m = matSel === 'open' ? data.materiais : weeks.find(w => w.semana === matSel).itens;
  let h = `<div class="weeks"><button class="wk${matSel === 'open' ? ' on' : ''}" onclick="selectWeek('open')">${t('open_week')} (${nextSunday()})</button>` +
    weeks.map(w => `<button class="wk${matSel === w.semana ? ' on' : ''}" onclick="selectWeek('${w.semana}')">${w.atrasado ? '⚠️ ' : (w.futuro ? t('next_cycle') + ' ' : '')}${matLabel(w.semana)}</button>`).join('') + `</div>`;
  if (!m.length) { $('p-mat').innerHTML = h + `<div class="empty">🧺<br>${t('no_sup')}</div>`; return; }
  const max = Math.max(...m.map(i => i.quantidade));
  const total = m.reduce((a, i) => a + i.quantidade, 0);
  h += `<div class="stats" style="grid-template-columns:1fr 1fr">
    <div class="stat"><div class="n">${m.length}</div><div class="l">${t('sup_items')}</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">${t('sup_orders')}</div></div></div>`;
  h += m.map(i => `<div class="card item">
    <div class="qty">${i.quantidade}x</div>
    <div class="item-main"><div class="item-name">${esc(i.nome)}</div>
      <div class="item-who">${t('asked_by')}: ${esc(i.quem.join(', '))}</div>
      <div class="item-bar"><i style="width:${Math.round(i.quantidade / max * 100)}%"></i></div></div>
    ${i.link ? `<a class="cart" href="${esc(i.link)}" target="_blank" rel="noopener">🛒</a>` : ''}
  </div>`).join('');
  $('p-mat').innerHTML = h;
}

function renderFb() {
  const f = data.feedbacks;
  if (!f.length) { $('p-fb').innerHTML = `<div class="empty">💬<br>${t('no_fb')}</div>`; return; }
  $('p-fb').innerHTML = f.map(x => `<div class="card">
    <div class="fb-top"><div><div class="fb-client">${esc(x.cliente || '—')}</div><div class="fb-meta">${esc(x.data)}${x.quem ? ' · ' + esc(x.quem) : ''}</div></div>
    ${x.nota ? `<div class="score">★ ${esc(x.nota)}</div>` : ''}</div>
    ${(x.punctuality || x.agility || x.quality) ? `<div class="fb-sub">${x.punctuality ? `<span>⏱ ${t('punct')}: ${esc(x.punctuality)}</span>` : ''}${x.agility ? `<span>⚡ ${t('agil')}: ${esc(x.agility)}</span>` : ''}${x.quality ? `<span>✨ ${t('qual')}: ${esc(x.quality)}</span>` : ''}</div>` : ''}
    ${x.comentario ? `<div class="fb-com">${esc(x.comentario)}</div>` : ''}
  </div>`).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  me = getSession();
  if (!me) { $('nosession').style.display = 'block'; applyLang(); return; }
  try { $('back-link').href = 'menu-teste.html' + location.hash; } catch(e) {}
  $('app').style.display = 'block';
  applyLang();
  load();
});
</script>
</body>
</html>
