<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relatório de Supplies - Paula's Cleaning Squad</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; font-size: 14px; min-height: 100vh; }

#screen-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: #fff; border-radius: 14px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
.login-logo { text-align: center; margin-bottom: 1.5rem; }
.login-logo .logo-title { font-size: 20px; font-weight: 700; color: #1a3a8f; }
.login-logo .logo-sub { font-size: 12px; color: #888; margin-top: 2px; }
.login-card h2 { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 1.25rem; text-align: center; }
.field { margin-bottom: 14px; }
.field label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; font-weight: 600; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: Arial; outline: none; }
.field input:focus { border-color: #1a3a8f; }
.login-btn { width: 100%; padding: 12px; background: #1a3a8f; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Arial; margin-top: 6px; }
.login-btn:hover { background: #153070; }
.login-btn:disabled { background: #aaa; cursor: not-allowed; }
.login-err { color: #c00; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
.login-loading { color: #888; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

#screen-app { display: none; padding: 20px; max-width: 700px; margin: 0 auto; }
.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.app-header .welcome { font-size: 13px; color: #555; }
.app-header .welcome strong { color: #1a3a8f; }
.logout-btn { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #555; cursor: pointer; font-family: Arial; }
.logout-btn:hover { background: #f5f5f5; }

.page-title { font-size: 20px; font-weight: 700; color: #1a3a8f; margin-bottom: 4px; }
.page-sub { font-size: 12px; color: #888; margin-bottom: 1.25rem; }

.refresh-btn { background: #f0f4ff; border: 1px solid #d0d8f0; border-radius: 8px; padding: 8px 14px; font-size: 13px; color: #1a3a8f; font-weight: 700; cursor: pointer; font-family: Arial; margin-bottom: 1rem; }
.refresh-btn:hover { background: #e4ecff; }

.report-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.report-table thead tr { background: #1a3a8f; color: #fff; }
.report-table th { padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.report-table th.qty-col, .report-table td.qty-col { text-align: center; }
.report-table td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.report-table tbody tr:last-child td { border-bottom: none; }
.report-table tbody tr:hover { background: #f8f9ff; }
.qty-badge { display: inline-block; background: #eef2ff; color: #1a3a8f; font-weight: 700; padding: 3px 12px; border-radius: 20px; font-size: 13px; }
.item-link { color: #1a3a8f; text-decoration: none; font-weight: 600; }
.item-link:hover { text-decoration: underline; }
.cart-icon { margin-left: 4px; }

.empty-state { text-align: center; padding: 3rem 1rem; color: #888; }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }

.loading-state { text-align: center; padding: 3rem 1rem; color: #888; font-size: 13px; }

.week-block { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.week-header { padding: 12px 16px; background: #f5f7ff; font-weight: 700; font-size: 13px; color: #1a3a8f; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.week-header:hover { background: #eef2ff; }
.week-body { display: none; padding: 4px 0; }
.week-body.open { display: block; }
.week-row { display: flex; justify-content: space-between; padding: 8px 16px; border-top: 1px solid #f0f0f0; font-size: 13px; }
</style>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PCS" />
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<script>(function(K){try{var s=JSON.parse(localStorage.getItem('pcs_session'));if(!s||!s.token||s.expires<Date.now()){location.replace('app.html');return;}if(K&&s.ocultas&&s.ocultas.indexOf(K)!==-1)location.replace('app.html');}catch(e){location.replace('app.html');}})(null);</script>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-title">Paula's Cleaning Squad</div>
      <div class="logo-sub">Relatório de Supplies</div>
    </div>
    <h2>Entrar</h2>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="Seu usuário" autocomplete="username" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-loading" id="login-loading">Verificando...</div>
  </div>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="app-header">
    <span class="welcome">Olá, <strong id="user-name"></strong></span>
    <div style="display:flex;gap:6px"><a class="logout-btn" href="app.html" style="text-decoration:none">‹ Menu</a><button class="logout-btn" onclick="doLogout()">Sair</button></div>
  </div>

  <div class="page-title">📦 Relatório Semanal de Supplies</div>
  <div class="page-sub">Lista de compra: tudo que ainda não foi comprado.</div>

  <button class="refresh-btn" onclick="loadReport(); loadHistorico();">🔄 Atualizar</button>

  <div id="report-container">
    <div class="loading-state">Carregando...</div>
  </div>

  <div class="page-title" style="margin-top:2rem;font-size:16px">🗂️ Já tratadas</div>
  <div id="historico-container" style="margin-top:0.75rem">
    <div class="loading-state">Carregando...</div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";

let currentUser = '';
let currentNome = '';

const SESSION_KEY = 'pcs_relatorio_session';
const SESSION_DURATION = 8 * 60 * 60 * 1000;

function saveSession(user, nome) {
  const s = { user, nome, expires: Date.now() + SESSION_DURATION };
  localStorage.setItem(SESSION_KEY, JSON.stringify(s));
}

function sessionFromHash() {
  try {
    if (location.hash && location.hash.length > 1) {
      const h = JSON.parse(atob(location.hash.slice(1)));
      if (h && h.user) return h;
    }
  } catch(e) {}
  return null;
}
function loadSession() {
  try {
    const h = sessionFromHash();
    if (h && h.acessoRelatorio) return h;
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() > s.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  } catch(e) { return null; }
}
function clearSession() { localStorage.removeItem(SESSION_KEY); }

window.addEventListener('DOMContentLoaded', () => {
  const s = loadSession();
  if (s) {
    currentUser = s.user;
    currentNome = s.nome || s.user;
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display = 'block';
    document.getElementById('user-name').textContent = currentNome;
    loadReport();
    loadHistorico();
  }
});

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-err');
  const loadEl = document.getElementById('login-loading');

  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  btn.disabled = true;
  loadEl.style.display = 'block';

  try {
    const url = `${SCRIPT_URL}?usuario=${encodeURIComponent(user)}&senha=${encodeURIComponent(pass)}&pagina=relatorio`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.ok) {
      if (!json.acessoRelatorio) {
        errEl.textContent = 'Você não tem permissão para acessar este relatório.';
        btn.disabled = false;
        loadEl.style.display = 'none';
        return;
      }
      currentUser = user;
      currentNome = json.nome || user;
      saveSession(user, currentNome);
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-app').style.display = 'block';
      document.getElementById('user-name').textContent = currentNome;
      loadReport();
      loadHistorico();
    } else {
      errEl.textContent = 'Usuário ou senha incorretos.';
    }
  } catch(e) {
    errEl.textContent = 'Erro de conexão. Tente novamente.';
  }

  btn.disabled = false;
  loadEl.style.display = 'none';
}

function clearAllSessions(){['pcs_session','pcs_relatorio_session','pcs_hub_session'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});}
function doLogout() {
  clearAllSessions();
  location.href='app.html';
  clearSession();
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'block';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

let viewMode = 'item', lastJson = null;
function setMode(m) { viewMode = m; drawReport(); }
let resp = {}; // índice do item -> 'sim' (comprei) | 'nao' (não comprei)
function setResp(idx, v) { resp[idx] = (resp[idx] === v ? undefined : v); drawReport(); }
async function salvarCompra() {
  const itens = (lastJson && lastJson.itens) || [];
  const compradas = [];
  itens.forEach((it, idx) => { if (resp[idx] === 'sim') compradas.push(...it.linhas); });
  const nNao = itens.filter((it, idx) => resp[idx] === 'nao').length;
  if (!confirm(compradas.length ? 'Salvar? O que ficou como "não comprei" volta na próxima semana.' : 'Nada foi comprado. Tudo volta na próxima semana. Salvar?')) return;
  try {
    if (compradas.length) {
      const r = await fetch(`${SCRIPT_URL}?action=compra_marcar&status=comprado&linhas=${compradas.join(',')}&token=${encodeURIComponent(pcsToken())}`).then(x => x.json());
      if (r.erro === 'perm') { goLogin(); return; }
    }
  } catch(e) { alert('Erro de conexão.'); return; }
  resp = {}; loadReport(); loadHistorico();
}
async function loadReport() {
  const container = document.getElementById('report-container');
  container.innerHTML = '<div class="loading-state">Carregando...</div>';
  try {
    const url = `${SCRIPT_URL}?action=resumo&token=${encodeURIComponent(pcsToken())}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.erro === 'perm') { goLogin(); return; }
    lastJson = json; resp = {};
    drawReport();
  } catch(e) {
    container.innerHTML = '<div class="empty-state">Erro ao carregar o relatório. Tente novamente.</div>';
  }
}
function drawReport() {
  const container = document.getElementById('report-container');
  try {
    const json = lastJson || {};
    const itens = json.itens || [];

    if (itens.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <div>Nada pendente para comprar.</div>
        </div>`;
      return;
    }

    const tabs = `<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="refresh-btn" style="margin:0;${viewMode==='item'?'background:#1a3a8f;color:#fff':''}" onclick="setMode('item')">Por item</button>
      <button class="refresh-btn" style="margin:0;${viewMode==='pessoa'?'background:#1a3a8f;color:#fff':''}" onclick="setMode('pessoa')">Por pessoa</button></div>`;
    const pode = !!json.podeMarcar;
    const resp0 = itens.filter((it, idx) => resp[idx]).length;
    const acoes = !pode ? '' : `<button class="login-btn" style="margin:14px 0 4px" ${resp0 === itens.length ? '' : 'disabled'} onclick="salvarCompra()">Salvar (${resp0}/${itens.length})</button>
      <div class="page-sub">Marque cada item: ✅ comprei ou ❌ não comprei. O que não foi comprado volta automaticamente na próxima semana.</div>`;
    if (viewMode === 'pessoa') {
      container.innerHTML = tabs + (json.porPessoa || []).map(p => `<div class="week-block"><div class="week-header" style="cursor:default">👤 ${p.nome}</div><div class="week-body open">` +
        p.itens.map(i => `<div class="week-row"><span>${i.nome}${i.antigo ? ` <span style="color:#c0392b;font-size:11px">⚠️ ${i.antigo} de semanas anteriores</span>` : ''}</span><span class="qty-badge">${i.qtd}x</span></div>`).join('') + `</div></div>`).join('');
      return;
    }
    let rows = itens.map((i, idx) => `
      <tr>
        <td>${i.link
          ? `<a class="item-link" href="${i.link}" target="_blank" rel="noopener">${i.nome} <span class="cart-icon">🛒</span></a>`
          : i.nome}${i.antigo ? `<div style="color:#c0392b;font-size:11px">⚠️ ${i.antigo} de semanas anteriores</div>` : ''}</td>
        <td class="qty-col"><span class="qty-badge">${i.quantidade}x</span></td>
        ${pode ? `<td class="qty-col" style="white-space:nowrap">
          <label style="cursor:pointer;font-size:12px;margin-right:8px"><input type="checkbox" ${resp[idx]==='sim'?'checked':''} onchange="setResp(${idx},'sim')"> ✅</label>
          <label style="cursor:pointer;font-size:12px"><input type="checkbox" ${resp[idx]==='nao'?'checked':''} onchange="setResp(${idx},'nao')"> ❌</label></td>` : ''}
      </tr>`).join('');

    container.innerHTML = tabs + `
      <table class="report-table">
        <thead><tr><th>Item</th><th class="qty-col">Qtd</th>${pode ? '<th class="qty-col">Comprei?</th>' : ''}</tr></thead>
        <tbody>${rows}</tbody>
      </table>` + acoes;
  } catch(e) {
    container.innerHTML = '<div class="empty-state">Erro ao carregar o relatório. Tente novamente.</div>';
  }
}

async function loadHistorico() {
  const container = document.getElementById('historico-container');
  container.innerHTML = '<div class="loading-state">Carregando...</div>';
  try {
    const url = `${SCRIPT_URL}?action=historico&token=${encodeURIComponent(pcsToken())}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.erro === 'perm') { goLogin(); return; }
    const semanas = json.semanas || [];

    if (semanas.length === 0) {
      container.innerHTML = '<div class="empty-state" style="padding:1.5rem"><div>Nenhuma semana tratada ainda.</div></div>';
      return;
    }

    container.innerHTML = semanas.map((s, idx) => `
      <div class="week-block">
        <div class="week-header" onclick="toggleWeek(${idx})">
          <span>Semana de ${s.semana} · ${s.status === 'estoque' ? '📦 Estoque' : (s.status === 'comprado' ? '✅ Comprado' : 'Enviado')}</span>
          <span id="week-arrow-${idx}">▾</span>
        </div>
        <div class="week-body" id="week-body-${idx}">
          ${s.itens.map(i => `
            <div class="week-row">
              <span>${i.link
                ? `<a class="item-link" href="${i.link}" target="_blank" rel="noopener">${i.nome} <span class="cart-icon">🛒</span></a>`
                : i.nome}</span>
              <span class="qty-badge">${i.quantidade}x</span>
            </div>`).join('')}
        </div>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = '<div class="empty-state">Erro ao carregar o histórico.</div>';
  }
}

function toggleWeek(idx) {
  const body = document.getElementById('week-body-' + idx);
  const arrow = document.getElementById('week-arrow-' + idx);
  const isOpen = body.classList.toggle('open');
  arrow.textContent = isOpen ? '▴' : '▾';
}
</script>
<script>
/* ── Segurança: sessão por token (o login só acontece no menu) ── */
function pcsToken(){ try{ var s=JSON.parse(localStorage.getItem('pcs_session')); return s&&s.token?s.token:''; }catch(e){ return ''; } }
function goLogin(){ location.replace('app.html'); }
function clearAllSessions(){ ['pcs_session','pcs_relatorio_session','pcs_hub_session'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); }
function loadSession(){ try{ var s=JSON.parse(localStorage.getItem('pcs_session')); if(s&&s.token&&s.expires>Date.now()) return s; }catch(e){} return null; }
function sessionFromHash(){ return null; }
function saveSession(){} function renewSession(){} function clearSession(){ clearAllSessions(); }
function doLogin(){ goLogin(); } function showForgot(){ goLogin(); } function sendForgot(){ goLogin(); }
function doLogout(){ var s=loadSession(); if(s){ try{ fetch(SCRIPT_URL+'?action=logout&token='+encodeURIComponent(s.token)); }catch(e){} } clearAllSessions(); goLogin(); }
</script>
</body>
</html>
