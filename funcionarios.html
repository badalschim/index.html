<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a3a8f" />
<title>Funcionários - Paula's Cleaning Squad</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222;font-size:14px;min-height:100vh;padding-bottom:80px}
.top{background:#1a3a8f;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.top-row{display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(255,255,255,.18);color:#fff;text-decoration:none;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:Arial}
h1{font-size:18px;margin:8px 0 2px}.sub{font-size:12px;opacity:.85}
.bar{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.bar input,.bar select,.bar button{border:1px solid #cfd6ea;background:#fff;border-radius:8px;padding:9px 10px;font-size:13px;font-family:Arial}
.bar .grow{flex:1;min-width:150px}
.bar button.on{background:#1a3a8f;color:#fff;font-weight:700}
.list{padding:0 12px 12px;max-width:1500px;margin:0 auto}
.stats{display:flex;gap:8px;padding:10px 12px 0;overflow-x:auto;max-width:1500px;margin:0 auto}
.st{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 1px 3px rgba(0,0,0,.07);min-width:96px;flex:0 0 auto}
.st b{display:block;font-size:20px;color:#1a3a8f}.st span{font-size:11px;color:#777;font-weight:700}
.st.w b{color:#c0392b}
.grp{margin-top:14px}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#fff;border-radius:10px;padding:7px 12px;margin-bottom:8px}
.gh .c{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fc{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:box-shadow .15s,transform .15s}
.fc:hover{box-shadow:0 4px 12px rgba(0,0,0,.13);transform:translateY(-1px)}
.fc.off{opacity:.55}
.av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb{flex:1;min-width:0}
.fc .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .m{font-size:12px;color:#666;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px;margin:5px 4px 0 0;background:#eef2ff;color:#1a3a8f}
.tag.g{background:#e6f6ea;color:#1f7a45}.tag.o{background:#fff4d6;color:#9a6a00}.tag.r{background:#fdeaea;color:#c0392b}
.acts{display:flex;flex-direction:column;gap:6px}
.acts a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;background:#f0f4ff;border-radius:50%}
.seg{display:inline-flex;border:1px solid #cfd6ea;border-radius:8px;overflow:hidden}
.seg button{border:none!important;border-radius:0!important}
.fab{position:fixed;right:16px;bottom:16px;background:#1a3a8f;color:#fff;border:none;border-radius:28px;padding:14px 20px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;font-family:Arial}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:16px}}
.modal h2{font-size:16px;color:#1a3a8f;margin-bottom:10px}
.sec{font-size:11px;font-weight:700;color:#1a3a8f;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;border-top:1px solid #eee;padding-top:10px}
.f{margin-bottom:10px}.f label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:9px;font-size:14px;font-family:Arial}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{display:flex;gap:8px;margin-top:14px}.mb button{flex:1;padding:12px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:Arial}
.b1{background:#1a3a8f;color:#fff}.b2{background:#eee;color:#333}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:10px 18px;font-size:13px;z-index:99;display:none}
.chk{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:14px;cursor:pointer}.chk input{width:18px;height:18px}
.sub2{font-size:11px;font-weight:700;color:#555;margin:10px 0 2px}
.empty{text-align:center;color:#888;padding:2rem 1rem;grid-column:1/-1}
.center{display:none;min-height:80vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
</style>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('pcs_session'));if(!s||!s.token||s.expires<Date.now()){location.replace('app.html');return;}}catch(e){location.replace('app.html');}})();</script>
</head>
<body>
<div id="app" style="display:none">
  <div class="top">
    <div class="top-row"><a class="pill" href="app.html">‹ Menu</a><button class="pill" onclick="load()">↻ Atualizar</button></div>
    <h1>Funcionários</h1><div class="sub" id="sub"></div>
  </div>
  <div class="bar">
    <input class="grow" id="q" placeholder="Buscar nome, telefone, e-mail…" oninput="render()">
    <select id="fe" onchange="render()"></select>
    <button id="bA" class="on" onclick="setAt('sim')">Ativos</button>
    <button id="bI" onclick="setAt('nao')">Inativos</button>
    <button id="bT" onclick="setAt('')">Todos</button>
    <span class="seg"><button id="vG" class="on" onclick="setVw('g')">Por equipe</button><button id="vL" onclick="setVw('l')">Lista</button></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>
  <button class="fab" onclick="abrir(null)">+ Funcionário</button>
</div>
<div class="center" id="noperm"><h2>Sem permissão</h2><p>Página exclusiva da gestão.</p><a class="pill" style="background:#1a3a8f" href="app.html">Ir ao menu</a></div>

<div class="ov" id="ov" onclick="if(event.target===this)fechar()">
  <div class="modal">
    <h2 id="mt">Funcionário</h2>
    <div class="f"><label>Situação</label><select id="f_ativo"><option value="sim">Ativo</option><option value="nao">Inativo</option></select></div>
    <div class="f2"><div class="f"><label>Nome</label><input id="f_nome"></div><div class="f"><label>Sobrenome</label><input id="f_sobrenome"></div></div>
    <div class="f" id="rowVinc" style="display:none"><label>Esse login já tem ficha? Vincular a:</label><select id="f_vinc" onchange="vincPick()"></select></div>
    <div class="f2"><div class="f"><label>Telefone</label><input id="f_telefone" type="tel"></div><div class="f"><label>E-mail (login do app)</label><input id="f_email" type="email"></div></div>
    <div class="sec">Trabalho</div>
    <div class="f2">
      <div class="f"><label>Equipe padrão</label><input id="f_equipe" list="dlEq" placeholder="Ex.: 3 ou Administrativo"><datalist id="dlEq"></datalist></div>
      <div class="f"><label>Perfil</label><input id="f_perfil" list="dlPf" placeholder="Cleaner, Manager…"><datalist id="dlPf"></datalist></div>
    </div>
    <div class="f2">
      <div class="f"><label>Motorista</label><select id="f_motorista"><option value="nao">Não</option><option value="sim">Sim</option></select></div>
      <div class="f" id="boxPag1"><label>Pagamento</label><select id="f_pag_tipo" onchange="togPag()"><option value="">— não definido —</option><option value="fixo_dia">Fixo por dia ($)</option><option value="percentual">% do serviço</option><option value="misto">Fixo na semana + % no fim de semana</option></select></div>
    </div>
    <div class="f2" id="boxPag2">
      <div class="f"><label id="lbPag">Valor</label><input id="f_pag_valor" type="number" step="0.01" min="0" placeholder="Ex.: 120 ou 70"></div>
      <div class="f" id="boxV2" style="display:none"><label>% sábado e domingo</label><input id="f_pag_valor2" type="number" step="0.01" min="0" max="100" placeholder="Ex.: 70"></div>
      <div class="f" id="boxHint"><label>&nbsp;</label><div class="sub2" style="margin:8px 0 0" id="pagHint"></div></div>
    </div>
    <div class="sec">Pessoal</div>
    <div class="f2"><div class="f"><label>Nascimento (DD/MM/AAAA)</label><input id="f_nascimento" placeholder="DD/MM/AAAA"></div><div class="f"><label>Zelle</label><input id="f_zelle"></div></div>
    <div class="f"><label>Endereço</label><input id="f_endereco"></div>
    <div class="f2"><div class="f"><label>Contato de emergência</label><input id="f_emerg_nome"></div><div class="f"><label>Tel. emergência</label><input id="f_emerg_tel" type="tel"></div></div>
    <div class="f"><label>Observações</label><textarea id="f_obs" rows="2"></textarea></div>
    <div class="sec">Acesso ao app</div>
    <label class="chk"><input type="checkbox" id="p_login" onchange="togLogin()"> Pode entrar no app (login = e-mail acima)</label>
    <label class="chk" id="rowConv"><input type="checkbox" id="p_convite" checked> Enviar e-mail para ela criar a senha</label>
    <div id="permBox">
      <div class="sub2">Telas que ela vê</div>
      <label class="chk"><input type="checkbox" id="p_aval"> ⭐ Avaliações</label>
      <label class="chk"><input type="checkbox" id="p_ped"> 🛒 Pedidos de material</label>
      <label class="chk"><input type="checkbox" id="p_inv"> 🧾 Invoice</label>
      <label class="chk"><input type="checkbox" id="p_disp"> 📅 Solicitar folga</label>
      <div class="sub2">Gestão</div>
      <label class="chk"><input type="checkbox" id="p_rel"> 📦 Relatório de supplies</label>
      <label class="chk"><input type="checkbox" id="p_compra"> ✅ Pode marcar "comprei"</label>
      <label class="chk"><input type="checkbox" id="p_adm"> 🗂️ Gerencia a escala (folgas)</label>
      <label class="chk"><input type="checkbox" id="p_dash"> 📊 Painel</label>
      <label class="chk"><input type="checkbox" id="p_atend"> 🧹 Meu atendimento (serviços do dia)</label>
      <label class="chk"><input type="checkbox" id="p_agenda"> 🗓️ Agenda e funcionários</label>
      <label class="chk" id="rowLucro"><input type="checkbox" id="p_lucro"> 💰 Lucro e salários (exige Agenda)</label>
      <label class="chk"><input type="checkbox" id="p_simula"> 👁️ "Ver como"</label>
      <label class="chk"><input type="checkbox" id="p_folga"> Aparece no relatório de folgas</label>
      <div class="f2" style="margin-top:8px">
        <div class="f"><label>Modelo de invoice</label><input id="p_modelo" placeholder="1, 2, 3…"></div>
        <div class="f"><label>Itens bloqueados</label><input id="p_bloq" placeholder="separe por vírgula"></div>
      </div>
    </div>
    <div class="mb"><button class="b2" onclick="fechar()">Fechar</button><button class="b1" onclick="salvar()">Salvar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAMPOS = ['nome','sobrenome','email','telefone','perfil','equipe','motorista','pag_tipo','pag_valor','pag_valor2','nascimento','zelle','endereco','emerg_nome','emerg_tel','ativo','obs'];
let me = null, lista = [], at = 'sim', editKey = null;
const PERMS = ['aval','ped','inv','disp','rel','compra','adm','dash','atend','agenda','lucro','simula','folga'];
const PERM_PADRAO = { aval: 1, ped: 1, inv: 1, disp: 1, folga: 1 };
function togLogin() { const on = $('p_login').checked; $('permBox').style.display = on ? 'block' : 'none'; $('rowConv').style.display = on && !(editKey !== null && lista[editKey].login) ? 'flex' : 'none'; }
function getSession() { try { const s = JSON.parse(localStorage.getItem('pcs_session')); if (s && s.token && s.expires > Date.now()) return s; } catch (e) {} return null; }
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); }
async function api(p) { const q = new URLSearchParams(Object.assign({ token: me.token }, p)).toString(); return (await fetch(SCRIPT_URL + '?' + q)).json(); }
function nomeCompleto(f) { return (f.nome + ' ' + (f.sobrenome || '')).trim(); }
function aniv(s) {
  const m = String(s || '').match(/^(\d{1,2})[\/\-](\d{1,2})/); if (!m) return null;
  const h = new Date(); h.setHours(0, 0, 0, 0);
  let d = new Date(h.getFullYear(), +m[2] - 1, +m[1]); if (d < h) d.setFullYear(h.getFullYear() + 1);
  return Math.round((d - h) / 86400000);
}
async function boot() {
  me = getSession();
  if (!me) { location.replace('app.html'); return; }
  if (!me.acessoAgenda) { $('noperm').style.display = 'flex'; return; }
  $('app').style.display = 'block'; await load();
}
async function load() {
  $('list').innerHTML = '<div class="empty">Carregando…</div>';
  try {
    const j = await api({ action: 'func_lista' });
    if (!j.ok) { $('list').innerHTML = '<div class="empty">Sem acesso.</div>'; return; }
    lista = j.funcionarios;
    const eq = [...new Set(lista.map(f => f.equipe).filter(Boolean))].sort((a, b) => (parseInt(a) || 999) - (parseInt(b) || 999));
    $('fe').innerHTML = '<option value="">Todas as equipes</option>' + eq.map(e => '<option>' + esc(e) + '</option>').join('');
    $('dlEq').innerHTML = Array.from({ length: 30 }, (_, i) => String(i + 1)).concat(['Administrativo']).map(e => '<option value="' + e + '">').join('');
    $('dlPf').innerHTML = [...new Set(lista.map(f => f.perfil).filter(Boolean))].map(e => '<option value="' + esc(e) + '">').join('');
    render();
  } catch (e) { $('list').innerHTML = '<div class="empty">Erro de conexão.</div>'; }
}
function setAt(v) { at = v; ['A', 'I', 'T'].forEach(k => $('b' + k).classList.toggle('on', (k === 'A' && v === 'sim') || (k === 'I' && v === 'nao') || (k === 'T' && v === ''))); render(); }
const COLORS = ['#1a3a8f','#1f9d55','#c0392b','#8e44ad','#e67e22','#16a085','#d35400','#2c3e50','#b8860b','#c2185b','#0277bd','#6d4c41'];
const cor = eq => /^\d+$/.test(eq || '') ? COLORS[parseInt(eq) % COLORS.length] : '#777';
let vw = 'g';
function setVw(v) { vw = v; $('vG').classList.toggle('on', v === 'g'); $('vL').classList.toggle('on', v === 'l'); render(); }
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const ini = f => { const p = ((f.nome || '') + ' ' + (f.sobrenome || '')).trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); };
function pagTxt(f) { return f.pag_tipo && f.pag_valor ? (f.pag_tipo === 'percentual' ? esc(f.pag_valor) + '%' : f.pag_tipo === 'misto' ? '$' + esc(f.pag_valor) + '/dia + ' + esc(f.pag_valor2 || 0) + '% fds' : '$' + esc(f.pag_valor) + '/dia') : ''; }
function cardF(f, dup) {
  const i = lista.indexOf(f), a = aniv(f.nascimento), tel = String(f.telefone || '').replace(/\D/g, '');
  const eh = /^\d+$/.test(f.equipe || '');
  const semPag = !!me.acessoLucro && eh && !(f.pag_tipo && f.pag_valor) && (f.ativo || 'sim') === 'sim';
  return '<div class="fc' + ((f.ativo || 'sim') === 'nao' ? ' off' : '') + '" onclick="abrir(' + i + ')"><div class="av" style="background:' + cor(f.equipe) + '">' + esc(ini(f)) + '</div><div class="fb"><div class="n">' + esc(nomeCompleto(f)) + '</div>' +
    '<div class="m">' + esc([f.perfil, f.telefone].filter(Boolean).join(' · ') || f.email || '—') + '</div>' +
    (f.email ? '<div class="m">' + esc(f.email) + '</div>' : '') +
    '<div>' + (vw === 'l' && f.equipe ? '<span class="tag">' + (eh ? 'Equipe ' : '') + esc(f.equipe) + '</span>' : '') +
    (f.motorista === 'sim' ? '<span class="tag o">🚗 Motorista</span>' : '') + (me.acessoLucro && pagTxt(f) ? '<span class="tag o">' + pagTxt(f) + '</span>' : '') +
    (f.login ? '<span class="tag g">📱 App</span>' : '') + (a !== null && a <= 14 ? '<span class="tag r">🎂 ' + (a === 0 ? 'hoje' : 'em ' + a + 'd') + '</span>' : '') +
    (f.semFicha ? '<span class="tag r">sem ficha</span>' : '') + (semPag ? '<span class="tag r">⚠ sem pagamento</span>' : '') + (dup ? '<span class="tag r">nome repetido</span>' : '') + '</div></div>' +
    (tel ? '<div class="acts" onclick="event.stopPropagation()"><a title="Ligar" href="tel:' + tel + '">📞</a><a title="WhatsApp" href="https://wa.me/' + (tel.length === 10 ? '1' : '') + tel + '" target="_blank">💬</a></div>' : '') + '</div>';
}
function render() {
  const q = $('q').value.trim().toLowerCase(), fe = $('fe').value;
  const l = lista.filter(f => (!at || (f.ativo || 'sim') === at) && (!fe || f.equipe === fe) && (!q || [nomeCompleto(f), f.telefone, f.email, f.perfil].join(' ').toLowerCase().indexOf(q) >= 0))
    .sort((a, b) => nomeCompleto(a).localeCompare(nomeCompleto(b)));
  const atv = lista.filter(f => (f.ativo || 'sim') === 'sim');
  $('sub').textContent = atv.length + ' ativos · ' + (lista.length - atv.length) + ' inativos';
  const cont = {}; atv.forEach(f => { const k = norm(nomeCompleto(f)); cont[k] = (cont[k] || 0) + 1; });
  const dupN = Object.keys(cont).filter(k => cont[k] > 1).length;
  const semPagN = me.acessoLucro ? atv.filter(f => /^\d+$/.test(f.equipe || '') && !(f.pag_tipo && f.pag_valor)).length : 0;
  const eqN = new Set(atv.map(f => f.equipe).filter(e => /^\d+$/.test(e || ''))).size;
  const niver = atv.filter(f => { const a = aniv(f.nascimento); return a !== null && a <= 14; }).length;
  const stat = (n, t, w) => '<div class="st' + (w && n ? ' w' : '') + '"><b>' + n + '</b><span>' + t + '</span></div>';
  $('stats').innerHTML = stat(atv.length, 'Ativos') + stat(eqN, 'Equipes em uso') + stat(atv.filter(f => f.login).length, 'Com app') + (me.acessoLucro ? stat(semPagN, 'Sem pagamento', 1) : '') + stat(dupN, 'Nomes repetidos', 1) + stat(niver, 'Aniversários 14d');
  if (!l.length) { $('list').innerHTML = '<div class="empty">Nenhum funcionário.</div>'; return; }
  const dup = f => cont[norm(nomeCompleto(f))] > 1 && (f.ativo || 'sim') === 'sim';
  if (vw === 'l') { $('list').innerHTML = '<div class="grid">' + l.map(f => cardF(f, dup(f))).join('') + '</div>'; return; }
  const g = {}; l.forEach(f => { const k = f.equipe || ''; (g[k] = g[k] || []).push(f); });
  const ordem = k => /^\d+$/.test(k) ? parseInt(k) : (k === '' ? 9998 : 9000 + k.charCodeAt(0));
  $('list').innerHTML = Object.keys(g).sort((a, b) => ordem(a) - ordem(b)).map(k =>
    '<div class="grp"><div class="gh" style="background:' + cor(k) + '">' + (k === '' ? 'Sem equipe' : /^\d+$/.test(k) ? 'Equipe ' + esc(k) : esc(k)) + '<span class="c">' + g[k].length + '</span></div><div class="grid">' + g[k].map(f => cardF(f, dup(f))).join('') + '</div></div>').join('');
}
function abrir(i) {
  editKey = i; const f = i === null ? { ativo: 'sim', motorista: 'nao' } : lista[i];
  $('mt').textContent = i === null ? 'Novo funcionário' : nomeCompleto(f);
  CAMPOS.forEach(k => $('f_' + k).value = f[k] || (k === 'ativo' ? 'sim' : k === 'motorista' ? 'nao' : ''));
  const pm = f.perm || null;
  $('rowVinc').style.display = f.semFicha ? 'block' : 'none';
  if (f.semFicha) $('f_vinc').innerHTML = '<option value="">Criar ficha nova</option>' + lista.map((x, n) => x.id && !x.email ? '<option value="' + n + '">' + esc(nomeCompleto(x)) + (x.equipe ? ' · ' + esc(x.equipe) : '') + (x.perfil ? ' · ' + esc(x.perfil) : '') + '</option>' : '').join('');
  $('p_login').checked = i === null ? true : !!f.loginAtivo;
  PERMS.forEach(k => $('p_' + k).checked = pm ? !!pm[k] : !!PERM_PADRAO[k]);
  $('p_modelo').value = pm ? pm.modelo : ''; $('p_bloq').value = pm ? pm.bloq : '';
  $('f_email').disabled = !!f.login; togPag();
  const vl = !!me.acessoLucro; ['boxPag1', 'boxPag2', 'rowLucro'].forEach(i => $(i).style.display = vl ? '' : 'none');
  $('p_convite').checked = true; togLogin();
  $('ov').classList.add('on');
}
function togPag() {
  const t = $('f_pag_tipo').value;
  $('lbPag').textContent = t === 'percentual' ? '% do valor do serviço' : t === 'misto' ? 'Fixo por dia, seg a sex ($)' : 'Valor por dia ($)';
  $('boxV2').style.display = t === 'misto' ? '' : 'none';
  $('boxHint').style.display = t === 'misto' ? 'none' : '';
  $('pagHint').textContent = t === 'percentual' ? 'Dividido entre as pessoas da equipe no dia.' : t ? 'Pago nos dias em que ela está numa equipe com serviço.' : '';
}
function vincPick() {
  const v = $('f_vinc').value; if (v === '') return;
  const x = lista[+v];
  ['nome', 'sobrenome', 'telefone', 'perfil', 'equipe', 'motorista', 'pagamento', 'nascimento', 'zelle', 'endereco', 'emerg_nome', 'emerg_tel', 'obs'].forEach(k => { if (x[k]) $('f_' + k).value = x[k]; });
}
function fechar() { $('ov').classList.remove('on'); }
async function salvar() {
  const vinc = (editKey !== null && lista[editKey].semFicha && $('f_vinc').value !== '') ? lista[+$('f_vinc').value] : null;
  const d = { action: 'func_salvar', id: vinc ? vinc.id : (editKey === null ? '' : (lista[editKey].id || '')) };
  CAMPOS.forEach(k => { if (!me.acessoLucro && (k === 'pag_tipo' || k === 'pag_valor' || k === 'pag_valor2')) return; d[k] = $('f_' + k).value; });
  if (!d.nome.trim()) { toast('Informe o nome'); return; }
  const tinha = editKey !== null && lista[editKey].login;
  if ($('p_login').checked && !d.email.trim()) { toast('Informe o e-mail para criar o login'); return; }
  if (d.email.trim()) {
    if ($('p_login').checked) {
      d.p_login = '1'; d.p_convite = (!tinha && $('p_convite').checked) ? '1' : '0';
      PERMS.forEach(k => d['p_' + k] = $('p_' + k).checked ? '1' : '0');
      d.p_modelo = $('p_modelo').value; d.p_bloq = $('p_bloq').value;
    } else if (tinha) d.p_login = '0';
  }
  try {
    const j = await api(d);
    if (!j.ok) throw 0;
    const o = {}; CAMPOS.forEach(k => { if (d[k] !== undefined) o[k] = d[k]; });
    if (editKey === null) lista.push(Object.assign({ id: j.id }, o)); else Object.assign(lista[editKey], o, { id: j.id, semFicha: false });
    if (d.p_login !== undefined) { o.login = d.p_login === '1' || tinha; o.loginAtivo = d.p_login === '1' && d.ativo === 'sim'; if (d.p_login === '1') { o.perm = {}; PERMS.forEach(k => o.perm[k] = d['p_' + k] === '1'); o.perm.modelo = d.p_modelo; o.perm.bloq = d.p_bloq; } }
    if (d.p_login !== undefined) Object.assign(editKey === null ? lista[lista.length - 1] : lista[editKey], { login: o.login, loginAtivo: o.loginAtivo }, o.perm ? { perm: o.perm } : {});
    if (vinc) { fechar(); await load(); toast('Vinculado'); return; }
    fechar(); render(); toast(j.convite === 'enviado' ? 'Salvo · e-mail enviado' : j.convite === 'falhou' ? 'Salvo · e-mail NÃO enviado' : 'Salvo');
  } catch (e) { toast('Não foi possível salvar'); }
}
boot();
