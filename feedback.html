<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PCS - Meus Feedbacks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; font-size: 14px; min-height: 100vh; }

#screen-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: #fff; border-radius: 14px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
.login-logo { text-align: center; margin-bottom: 1.5rem; }
.login-logo .logo-title { font-size: 20px; font-weight: 700; color: #1a3a8f; }
.login-logo .logo-sub { font-size: 12px; color: #888; margin-top: 2px; }
.login-card h2 { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 1.25rem; text-align: center; }
.field { margin-bottom: 14px; }
.field label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; font-weight: 600; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: Arial; outline: none; }
.field input:focus { border-color: #1a3a8f; }
.login-btn { width: 100%; padding: 12px; background: #1a3a8f; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: Arial; margin-top: 6px; }
.login-btn:hover { background: #153070; }
.login-btn:disabled { background: #aaa; cursor: not-allowed; }
.login-err { color: #c00; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
.login-loading { color: #888; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

#screen-app { display: none; padding: 20px; max-width: 700px; margin: 0 auto; }
.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.app-header .welcome { font-size: 15px; color: #555; }
.app-header .welcome strong { color: #1a3a8f; }
.logout-btn { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #555; cursor: pointer; font-family: Arial; }
.logout-btn:hover { background: #f5f5f5; }

/* Summary */
.summary-card { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; text-align: center; }
.avg-overall { text-align: center; margin-bottom: 1.25rem; }
.avg-stars { font-size: 28px; margin-bottom: 4px; }
.avg-num { font-size: 26px; font-weight: 700; color: #1a3a8f; }
.avg-sub { font-size: 12px; color: #888; margin-top: 2px; }
.progress-bar { background: #e8e8e8; border-radius: 20px; height: 10px; overflow: hidden; margin: 8px auto 4px; max-width: 260px; }
.progress-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #f5a623, #f7c948); transition: width 0.6s ease; }
.approval-pct { font-size: 13px; color: #555; text-align: center; }

.categories { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 1rem; }
.cat-item { background: #f8f9ff; border-radius: 8px; padding: 12px; text-align: center; }
.cat-label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
.cat-stars { font-size: 16px; margin-bottom: 4px; }
.cat-num { font-size: 16px; font-weight: 700; color: #1a3a8f; }

/* Feedback cards */
.section-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
.feedback-card { background: #fff; border-radius: 10px; padding: 1.25rem; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.feedback-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.feedback-client { font-size: 15px; font-weight: 700; color: #222; }
.feedback-date { font-size: 11px; color: #aaa; white-space: nowrap; margin-left: 8px; }
.feedback-cats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.feedback-cat { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f8f9ff; border-radius: 6px; }
.feedback-cat-label { font-size: 11px; color: #666; font-weight: 600; }
.feedback-cat-stars { font-size: 13px; }
.feedback-comment { font-size: 13px; color: #555; line-height: 1.6; font-style: italic; border-top: 1px solid #f0f0f0; padding-top: 10px; margin-top: 2px; }
.no-feedbacks { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; background: #fff; border-radius: 10px; }
.loading-msg { text-align: center; padding: 2rem; color: #888; font-size: 14px; }

@media (max-width: 480px) {
  .categories { grid-template-columns: 1fr; }
  .feedback-cats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-title">Paula's Cleaning Squad</div>
      <div class="logo-sub">Meus Feedbacks</div>
    </div>
    <h2>Entrar</h2>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="Seu usuário" autocomplete="username" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-loading" id="login-loading">Verificando...</div>
  </div>
</div>

<div id="screen-app">
  <div class="app-header">
    <span class="welcome">Olá, <strong id="user-name"></strong></span>
    <button class="logout-btn" onclick="doLogout()">Sair</button>
  </div>

  <div id="summary-card" class="summary-card">
    <div class="loading-msg">Carregando feedbacks...</div>
  </div>

  <div class="filter-bar" style="background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.07);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
    <div style="flex:1;min-width:120px">
      <label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:3px">De</label>
      <input type="date" id="filter-start" onchange="applyFilter()" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:Arial" />
    </div>
    <div style="flex:1;min-width:120px">
      <label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:3px">Até</label>
      <input type="date" id="filter-end" onchange="applyFilter()" style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:Arial" />
    </div>
    <button onclick="clearFilter()" style="padding:6px 14px;background:none;border:1px solid #ccc;border-radius:6px;font-size:12px;color:#888;cursor:pointer;font-family:Arial;white-space:nowrap">Limpar filtro</button>
  </div>
  <div class="section-title">Histórico de feedbacks</div>
  <div id="feedbacks-list"><div class="loading-msg">Carregando...</div></div>
</div>

<script>
// ============================================================
// SUBSTITUA PELA URL DO SEU APPS SCRIPT
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";
// ============================================================

let currentUser = '';


// ── SESSION MANAGEMENT (30 min) ──
const SESSION_KEY = 'pcs_session';
const SESSION_DURATION = 30 * 60 * 1000;

function saveSession(user, nome, modelo) {
  const session = { user, nome, modelo, expires: Date.now() + SESSION_DURATION };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  try { location.hash = btoa(JSON.stringify({user, nome, modelo})); } catch(e) {}
}

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (s && s.expires > Date.now()) return s;
    localStorage.removeItem(SESSION_KEY);
  } catch(e) {}
  try {
    if (location.hash && location.hash.length > 1) {
      const s = JSON.parse(atob(location.hash.slice(1)));
      if (s && s.user) {
        s.expires = Date.now() + SESSION_DURATION;
        localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        return s;
      }
    }
  } catch(e) {}
  return null;
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  location.hash = '';
}

function renewSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (s) { s.expires = Date.now() + SESSION_DURATION; localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  } catch(e) {}
}

document.addEventListener('click', renewSession);
document.addEventListener('keydown', renewSession);
window.addEventListener('load', function() {
  const s = loadSession();
  if (s) {
    currentUser = s.user;
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display = 'block';
    document.getElementById('user-name').textContent = s.nome || s.user;
    loadFeedbacks(s.user);
    renewSession();
  }
});
// ── END SESSION ──


async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const errEl = document.getElementById('login-err');
  const loadEl = document.getElementById('login-loading');
  const btn = document.getElementById('login-btn');

  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  btn.disabled = true;
  loadEl.style.display = 'block';

  try {
    const url = `${SCRIPT_URL}?usuario=${encodeURIComponent(user)}&senha=${encodeURIComponent(pass)}&pagina=feedback`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.ok) {
      currentUser = user;
      saveSession(user, json.nome || user, json.modelo);
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-app').style.display = 'block';
      document.getElementById('user-name').textContent = json.nome || user;
      loadFeedbacks(user);
    } else {
      errEl.textContent = 'Usuário ou senha incorretos.';
    }
  } catch(e) {
    errEl.textContent = 'Erro de conexão. Tente novamente.';
  }

  btn.disabled = false;
  loadEl.style.display = 'none';
}

function doLogout() {
  clearSession();
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('summary-card').innerHTML = '<div class="loading-msg">Carregando feedbacks...</div>';
  document.getElementById('feedbacks-list').innerHTML = '<div class="loading-msg">Carregando...</div>';
}

async function loadFeedbacks(user) {
  try {
    const url = `${SCRIPT_URL}?action=feedbacks&usuario=${encodeURIComponent(user)}`;
    const res = await fetch(url);
    const json = await res.json();
    allFeedbacks = json.feedbacks || [];
    renderFeedbacks(allFeedbacks);
  } catch(e) {
    document.getElementById('feedbacks-list').innerHTML = '<div class="no-feedbacks">Erro ao carregar feedbacks.</div>';
    document.getElementById('summary-card').innerHTML = '<div class="no-feedbacks">Erro ao carregar.</div>';
  }
}

function stars(n, size) {
  const s = size || 16;
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += `<span style="color:${i<=n?'#f5a623':'#ddd'};font-size:${s}px">★</span>`;
  }
  return html;
}

function avg(arr) {
  if (!arr.length) return 0;
  return arr.reduce((s,v)=>s+v,0)/arr.length;
}

let allFeedbacks = [];

function formatDate(dateStr) {
  if (!dateStr) return '';
  const parsed = parseDate(dateStr);
  if (!parsed || isNaN(parsed)) return (dateStr+'').split(' ')[0];
  const d = String(parsed.getDate()).padStart(2,'0');
  const m = String(parsed.getMonth()+1).padStart(2,'0');
  const y = parsed.getFullYear();
  return d+'/'+m+'/'+y;
}

function parseDate(dateStr) {
  if (!dateStr) return null;
  const d = (dateStr + '').trim().split(' ')[0].split('T')[0];
  const parts = d.split(/[-\/]/);
  if (parts.length === 3) {
    let y, m, day;
    if (parts[0].length === 4) {
      // yyyy-mm-dd
      y = parseInt(parts[0]); m = parseInt(parts[1])-1; day = parseInt(parts[2]);
    } else if (parseInt(parts[2]) > 31) {
      // dd/mm/yyyy
      y = parseInt(parts[2]); m = parseInt(parts[1])-1; day = parseInt(parts[0]);
    } else {
      // mm/dd/yy or mm/dd/yyyy (American format)
      y = parseInt(parts[2]); m = parseInt(parts[0])-1; day = parseInt(parts[1]);
      if (y < 100) y += 2000;
    }
    return new Date(y, m, day);
  }
  return new Date(d);
}

function applyFilter() {
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  let filtered = allFeedbacks;
  if (start) filtered = filtered.filter(f => { const d = parseDate(f.data); return d && d >= new Date(start); });
  if (end) filtered = filtered.filter(f => { const d = parseDate(f.data); return d && d <= new Date(end + 'T23:59:59'); });
  renderFeedbacks(filtered);
}

function clearFilter() {
  document.getElementById('filter-start').value = '';
  document.getElementById('filter-end').value = '';
  renderFeedbacks(allFeedbacks);
}

function renderFeedbacks(feedbacks) {
  const summaryEl = document.getElementById('summary-card');
  const listEl = document.getElementById('feedbacks-list');

  if (!feedbacks.length) {
    summaryEl.innerHTML = '<div class="no-feedbacks">⭐ Nenhum feedback ainda.</div>';
    listEl.innerHTML = '';
    return;
  }

  const total = feedbacks.length;
  const punch = avg(feedbacks.map(f=>parseFloat(f.punctuality)||0));
  const agil  = avg(feedbacks.map(f=>parseFloat(f.agility)||0));
  const qual  = avg(feedbacks.map(f=>parseFloat(f.quality)||0));
  const overall = avg([punch, agil, qual]);
  const pct = Math.round((overall/5)*100);

  summaryEl.innerHTML = `
    <div class="summary-title">Meu desempenho (${total} feedback${total>1?'s':''})</div>
    <div class="avg-overall">
      <div class="avg-stars">${stars(Math.round(overall), 28)}</div>
      <div class="avg-num">${overall.toFixed(1)} / 5</div>
      <div class="avg-sub">${pct}% de aprovação</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="categories">
      <div class="cat-item">
        <div class="cat-label">Punctuality</div>
        <div class="cat-stars">${stars(Math.round(punch), 14)}</div>
        <div class="cat-num">${punch.toFixed(1)}</div>
      </div>
      <div class="cat-item">
        <div class="cat-label">Agility</div>
        <div class="cat-stars">${stars(Math.round(agil), 14)}</div>
        <div class="cat-num">${agil.toFixed(1)}</div>
      </div>
      <div class="cat-item">
        <div class="cat-label">Quality</div>
        <div class="cat-stars">${stars(Math.round(qual), 14)}</div>
        <div class="cat-num">${qual.toFixed(1)}</div>
      </div>
    </div>`;

  listEl.innerHTML = feedbacks.map(f => `
    <div class="feedback-card">
      <div class="feedback-header">
        <span class="feedback-client">${f.cliente||'Cliente'}</span>
        <span class="feedback-date">${formatDate(f.data)}</span>
      </div>
      <div class="feedback-cats">
        <div class="feedback-cat">
          <span class="feedback-cat-label">Punctuality</span>
          <span class="feedback-cat-stars">${stars(parseInt(f.punctuality)||0, 12)}</span>
        </div>
        <div class="feedback-cat">
          <span class="feedback-cat-label">Agility</span>
          <span class="feedback-cat-stars">${stars(parseInt(f.agility)||0, 12)}</span>
        </div>
        <div class="feedback-cat">
          <span class="feedback-cat-label">Quality</span>
          <span class="feedback-cat-stars">${stars(parseInt(f.quality)||0, 12)}</span>
        </div>
      </div>
      <div class="feedback-comment">${f.comentario ? '"'+f.comentario+'"' : '<span style="color:#ccc;font-style:normal">Sem comentário</span>'}</div>
    </div>`).join('');
}
</script>
</body>
</html>
