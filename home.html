<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Paula's Cleaning Squad — Portal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #eef6f6; min-height: 100vh; }

.banner-wrap { width: 100%; }
.banner-wrap img { width: 100%; display: block; }

.portal-section { max-width: 560px; margin: 0 auto; padding: 40px 20px 50px; text-align: center; }

.portal-title { font-size: 14px; font-weight: 700; color: #2c7a7a; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.portal-sub { font-size: 13px; color: #888; margin-bottom: 32px; }

.portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.portal-card {
  background: #fff; border-radius: 16px; padding: 32px 20px;
  box-shadow: 0 4px 20px rgba(44,122,122,0.1);
  border: 1px solid rgba(44,122,122,0.12);
  text-decoration: none; color: #222;
  transition: transform .2s, box-shadow .2s;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.portal-card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(44,122,122,0.18); }
.portal-card .card-icon { font-size: 2.6rem; }
.portal-card .card-title { font-size: 15px; font-weight: 700; color: #2c7a7a; }
.portal-card .card-desc { font-size: 12px; color: #888; line-height: 1.5; text-align: center; }

.portal-card.primary { background: #2c5f8a; }
.portal-card.primary .card-title { color: #fff; }
.portal-card.primary .card-desc { color: rgba(255,255,255,0.7); }

.back-link { margin-top: 28px; }
.back-link a { font-size: 12px; color: #aaa; text-decoration: none; }
.back-link a:hover { color: #2c7a7a; }

footer { text-align: center; padding: 16px; font-size: 11px; color: #bbb; border-top: 1px solid #e0eded; }

@media (max-width: 480px) { .portal-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>



<div class="portal-section">
  <div class="portal-title">Employee Portal</div>
  <div class="portal-sub">Select your area below</div>
  <div class="portal-grid">
    <a href="https://badalschim.github.io/index.html/invoice.html" class="portal-card primary">
      <div class="card-icon">📄</div>
      <div class="card-title">Invoice</div>
      <div class="card-desc">Generate and download your weekly invoice PDF</div>
    </a>
    <a href="https://badalschim.github.io/index.html/feedback.html" class="portal-card">
      <div class="card-icon">⭐</div>
      <div class="card-title">Feedbacks</div>
      <div class="card-desc">View your performance ratings and client reviews</div>
    </a>
  </div>
  <div class="back-link"><a href="https://paulascleaningsquad.com">← Back to Services Page</a></div>
</div>

<footer>© 2025 Paula's Cleaning Squad · Space Coast, Florida</footer>

</body>
</html>
