<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a3a8f" />
<title>Menu (teste) - Paula's Cleaning Squad</title>
<style>
:root { --blue:#1a3a8f; --blue2:#2f5bd8; --bg:#f3f5fb; --card:#fff; --txt:#1b2233; --mut:#7a8399; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; min-height: 100vh; }
.test-banner { background: #fff4d6; color: #7a5a00; text-align: center; font-size: 11px; padding: 5px 10px; }

.lang { display: flex; gap: 2px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px; }
.lang button { border: none; background: none; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-size: 11px; font-weight: 700; color: #fff; font-family: inherit; }
.lang button.active { background: #fff; color: var(--blue); }

/* LOGIN */
#screen-login { min-height: calc(100vh - 24px); display: flex; flex-direction: column; background: linear-gradient(160deg, var(--blue) 0%, var(--blue2) 100%); }
.login-top { display: flex; justify-content: flex-end; padding: 14px 16px 0; }
.login-hero { color: #fff; text-align: center; padding: 38px 24px 26px; }
.login-hero .logo { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 14px; }
.login-hero h1 { font-size: 22px; font-weight: 800; }
.login-hero p { font-size: 13px; opacity: .8; margin-top: 4px; }
.login-card { background: var(--card); border-radius: 28px 28px 0 0; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); flex: 1; width: 100%; max-width: 480px; margin: 0 auto; }
.login-card h2 { font-size: 18px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { font-size: 12px; color: var(--mut); display: block; margin-bottom: 5px; font-weight: 600; }
.field input { width: 100%; padding: 14px; border: 1.5px solid #e1e5ef; border-radius: 14px; font-size: 16px; font-family: inherit; outline: none; background: #f8f9fd; }
.field input:focus { border-color: var(--blue2); background: #fff; }
.login-btn { width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px; }
.login-btn:active { transform: scale(.98); }
.login-btn:disabled { background: #aab; }
.login-err { color: #c00; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
.login-loading { color: var(--mut); font-size: 13px; text-align: center; margin-top: 8px; display: none; }

/* APP */
#screen-app { display: none; max-width: 720px; margin: 0 auto; padding-bottom: 30px; }
.hero { background: linear-gradient(160deg, var(--blue) 0%, var(--blue2) 100%); color: #fff; padding: 16px 18px 70px; border-radius: 0 0 30px 30px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; }
.hero h1 { font-size: 24px; font-weight: 800; margin-top: 22px; }
.hero p { font-size: 13px; opacity: .8; margin-top: 3px; }
.logout-btn { background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; margin-top: -44px; }
.tile { background: var(--card); border-radius: 22px; padding: 18px 16px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 12px; min-height: 150px; box-shadow: 0 6px 18px rgba(26,58,143,.08); transition: transform .15s, box-shadow .15s; opacity: 0; animation: up .45s forwards; }
.tile:active { transform: scale(.96); }
.tile:hover { box-shadow: 0 10px 24px rgba(26,58,143,.15); }
.tile .ico { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 27px; }
.tile .t { font-size: 16px; font-weight: 800; }
.tile .s { font-size: 12px; color: var(--mut); margin-top: 3px; line-height: 1.35; }
.tile .go { margin-top: auto; align-self: flex-end; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--blue); font-size: 16px; font-weight: 700; }
.tile.wide { grid-column: span 2; flex-direction: row; align-items: center; min-height: 0; }
.tile.wide .go { margin: 0 0 0 auto; align-self: center; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } .tile.wide { grid-column: auto; flex-direction: column; align-items: stretch; } .tile.wide .go { margin: auto 0 0; align-self: flex-end; } }
</style>
</head>
<body>

<div class="test-banner">Página de teste, ainda não está no ar</div>

<div id="screen-login">
  <div class="login-top"><div class="lang">
    <button data-lang-btn="pt" onclick="setLang('pt')">PT</button>
    <button data-lang-btn="en" onclick="setLang('en')">EN</button>
    <button data-lang-btn="es" onclick="setLang('es')">ES</button>
  </div></div>
  <div class="login-hero">
    <div class="logo">✨</div>
    <h1>Paula's Cleaning Squad</h1>
    <p data-i18n="team_access">Acesso da equipe</p>
  </div>
  <div class="login-card">
    <h2 data-i18n="login_title">Entrar</h2>
    <div class="field">
      <label data-i18n="username_label">Usuário</label>
      <input type="text" id="login-user" data-i18n-placeholder="username_placeholder" placeholder="Seu usuário" autocomplete="username" autocapitalize="none" />
    </div>
    <div class="field">
      <label data-i18n="password_label">Senha</label>
      <input type="password" id="login-pass" data-i18n-placeholder="password_placeholder" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()" data-i18n="login_btn">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-loading" id="login-loading" data-i18n="verifying">Verificando...</div>
  </div>
</div>

<div id="screen-app">
  <div class="hero">
    <div class="hero-top">
      <div class="lang">
        <button data-lang-btn="pt" onclick="setLang('pt')">PT</button>
        <button data-lang-btn="en" onclick="setLang('en')">EN</button>
        <button data-lang-btn="es" onclick="setLang('es')">ES</button>
      </div>
      <button class="logout-btn" onclick="doLogout()" data-i18n="logout_btn">Sair</button>
    </div>
    <h1><span data-i18n="hello">Olá,</span> <span id="user-name"></span> 👋</h1>
    <p data-i18n="what_today">O que você quer fazer hoje?</p>
  </div>
  <div class="grid" id="menu-grid"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGtMi4dY_1_eewqbyU8w05JNk9IqPOKFHkwzLGEP1tICwpZSyyswetMA8VA_ZwkI83-A/exec";

const SESSION_KEY = 'pcs_hub_session';
const SESSION_DURATION = 8 * 60 * 60 * 1000;

const TRANSLATIONS = {
  pt: {
    team_access: 'Acesso da equipe', login_title: 'Entrar', username_label: 'Usuário', username_placeholder: 'Seu usuário',
    password_label: 'Senha', password_placeholder: 'Sua senha', login_btn: 'Entrar', verifying: 'Verificando...',
    hello: 'Olá,', what_today: 'O que você quer fazer hoje?', logout_btn: 'Sair',
    feedback_t: 'Avaliações', feedback_s: 'Seus feedbacks e notas',
    supplies_t: 'Pedido de materiais', supplies_s: 'Lista de supplies',
    invoice_t: 'Invoice', invoice_s: 'Gerar e salvar invoice',
    avail_t: 'Disponibilidade', avail_s: 'Dias que você pode trabalhar',
    report_t: 'Relatório semanal', report_s: 'Pedidos de materiais da semana',
    fill_user_pass: 'Preencha usuário e senha.', wrong_credentials: 'Usuário ou senha incorretos.',
    connection_error_retry: 'Erro de conexão. Tente novamente.'
  },
  en: {
    team_access: 'Team access', login_title: 'Log In', username_label: 'Username', username_placeholder: 'Your username',
    password_label: 'Password', password_placeholder: 'Your password', login_btn: 'Log In', verifying: 'Verifying...',
    hello: 'Hi,', what_today: 'What would you like to do today?', logout_btn: 'Log Out',
    feedback_t: 'Reviews', feedback_s: 'Your feedback and ratings',
    supplies_t: 'Supplies request', supplies_s: 'Supply list',
    invoice_t: 'Invoice', invoice_s: 'Create and save invoice',
    avail_t: 'Availability', avail_s: 'Days you can work',
    report_t: 'Weekly report', report_s: "This week's supply requests",
    fill_user_pass: 'Fill in username and password.', wrong_credentials: 'Incorrect username or password.',
    connection_error_retry: 'Connection error. Please try again.'
  },
  es: {
    team_access: 'Acceso del equipo', login_title: 'Iniciar sesión', username_label: 'Usuario', username_placeholder: 'Tu usuario',
    password_label: 'Contraseña', password_placeholder: 'Tu contraseña', login_btn: 'Iniciar sesión', verifying: 'Verificando...',
    hello: 'Hola,', what_today: '¿Qué quieres hacer hoy?', logout_btn: 'Salir',
    feedback_t: 'Evaluaciones', feedback_s: 'Tus comentarios y notas',
    supplies_t: 'Pedido de materiales', supplies_s: 'Lista de suministros',
    invoice_t: 'Invoice', invoice_s: 'Crear y guardar invoice',
    avail_t: 'Disponibilidad', avail_s: 'Días que puedes trabajar',
    report_t: 'Informe semanal', report_s: 'Pedidos de materiales de la semana',
    fill_user_pass: 'Completa usuario y contraseña.', wrong_credentials: 'Usuario o contraseña incorrectos.',
    connection_error_retry: 'Error de conexión. Inténtalo de nuevo.'
  }
};

let currentLang = localStorage.getItem('pcs_lang') || 'pt';
let currentUser = '';
let currentNome = '';
let currentAcessoRelatorio = false;
let currentModelo = '';
let currentBloq = [];

function t(key) {
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.pt[key] || key;
}

function hashFor() {
  try {
    const j = JSON.stringify({ user: currentUser, nome: currentNome, modelo: currentModelo, bloqueados: currentBloq, acessoRelatorio: currentAcessoRelatorio })
      .replace(/[\u0080-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
    return '#' + btoa(j);
  } catch(e) { return ''; }
}

function buildMenu() {
  const items = [
    { href: 'feedback.html', icon: '⭐', bg: '#e8efff', t: 'feedback_t', s: 'feedback_s' },
    { href: 'supplies.html', icon: '🛒', bg: '#e6f6ea', t: 'supplies_t', s: 'supplies_s' },
    { href: 'invoice.html',  icon: '🧾', bg: '#fff4d6', t: 'invoice_t',  s: 'invoice_s' },
    { href: 'disponibilidade.html', icon: '📅', bg: '#ffe9e4', t: 'avail_t', s: 'avail_s' }
  ];
  if (currentAcessoRelatorio) {
    items.push({ href: 'relatorio.html', icon: '📦', bg: '#f1e8ff', t: 'report_t', s: 'report_s', wide: true });
  }
  document.getElementById('menu-grid').innerHTML = items.map((i, n) => `
    <a class="tile${i.wide ? ' wide' : ''}" href="${i.href}${hashFor()}" style="animation-delay:${n * 70}ms">
      <div class="ico" style="background:${i.bg}">${i.icon}</div>
      <div><div class="t">${t(i.t)}</div><div class="s">${t(i.s)}</div></div>
      <div class="go">›</div>
    </a>`).join('');
}

function applyLanguage() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.querySelectorAll('[data-lang-btn]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-lang-btn') === currentLang);
  });
  if (document.getElementById('screen-app').style.display === 'block') buildMenu();
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('pcs_lang', lang);
  applyLanguage();
}

function saveSession(user, nome, acessoRelatorio, modelo, bloqueados) {
  try {
    const exp = Date.now() + SESSION_DURATION;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ user, nome, acessoRelatorio, modelo, bloqueados: bloqueados || [], expires: exp }));
    localStorage.setItem('pcs_session', JSON.stringify({ user, nome, modelo, bloqueados: bloqueados || [], expires: exp }));
    if (acessoRelatorio) localStorage.setItem('pcs_relatorio_session', JSON.stringify({ user, nome, expires: exp }));
    else localStorage.removeItem('pcs_relatorio_session');
  } catch(e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() > s.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  } catch(e) { return null; }
}
function clearSession() { ['pcs_hub_session','pcs_session','pcs_relatorio_session'].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} }); }

function showApp() {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display = 'block';
  document.getElementById('user-name').textContent = currentNome;
  buildMenu();
}

window.addEventListener('DOMContentLoaded', () => {
  const s = loadSession();
  if (s) {
    currentUser = s.user;
    currentNome = s.nome || s.user;
    currentAcessoRelatorio = !!s.acessoRelatorio;
    currentModelo = s.modelo || '';
    currentBloq = s.bloqueados || [];
    showApp();
  }
  applyLanguage();
});

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-err');
  const loadEl = document.getElementById('login-loading');

  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = t('fill_user_pass'); return; }

  btn.disabled = true;
  loadEl.style.display = 'block';

  try {
    const url = `${SCRIPT_URL}?usuario=${encodeURIComponent(user)}&senha=${encodeURIComponent(pass)}&pagina=menu`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.ok) {
      currentUser = user;
      currentNome = json.nome || user;
      currentAcessoRelatorio = !!json.acessoRelatorio;
      currentModelo = json.modelo || '';
      currentBloq = json.bloqueados || [];
      saveSession(user, currentNome, currentAcessoRelatorio, json.modelo, json.bloqueados);
      showApp();
    } else {
      errEl.textContent = t('wrong_credentials');
    }
  } catch(e) {
    errEl.textContent = t('connection_error_retry');
  }

  btn.disabled = false;
  loadEl.style.display = 'none';
}

function doLogout() {
  clearSession();
  currentAcessoRelatorio = false;
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}
</script>
</body>
</html>
