 print{body{background:white}.sticky,.tools,#introcontrols{display:none!important}.wrap{padding:0}.question{break-inside:avoid;box-shadow:none}.answer{display:block!important}header{color:black;background:white;border:1px solid #ddd}header p{color:black}}</style></head><body><main class="wrap"><header><h1>Dental Study Quiz</h1><p>100 questions • Infection Prevention and Control (1–50) • Dental Radiology and Radiation Safety (51–100)</p><p class="small"></p></header><section class="panel" id="introcontrols"><label for="student"><strong>Student name (optional)</strong></label><br><input id="student" type="text" placeholder="Your name" style="margin:9px 0;width:330px"><div class="tools"><button id="save">Save answers on this device</button><button id="reset" class="secondary">Clear answers</button><button id="print" class="secondary">Print / Save as PDF</button></div><p class="hint"></p><div class="progress"><div id="bar" class="bar"></div></div><p class="meta" id="progresslabel">0 of 100 answered</p></section><section id="result" class="panel" aria-live="polite"><div class="score" id="scorenumber"></div><p id="scoretext"></p><div class="tools"><button id="reviewwrong" class="secondary">First incorrect answer</button><button id="reviewall" class="secondary">Review all questions</button></div></section><div id="quiz"></div></main><aside class="sticky"><div class="inner"><span id="footprogress"><strong>0/100</strong> answered</span><div class="tools"><button id="correct">Grade quiz</button><button id="top" class="secondary">Back to top ↑</button></div></div></aside><script>
const QUESTIONS=[{"topic": "Infection Prevention and Control", "q": "To whom do standard precautions apply?", "why": "Standard precautions apply to every patient.", "options": ["All patients regardless of diagnosis", "Only patients with known infections", "Only surgical patients", "Only patients with bleeding"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "When should hand hygiene be performed?", "why": "Gloves never replace hand hygiene.", "options": ["Only once each morning", "Before putting on gloves and after removing them", "Only when gloves tear", "Only at the end of a shift"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What should you use when hands are visibly dirty?", "why": "Visible dirt requires washing with soap and water.", "options": ["Alcohol rub only", "Dry paper towels only", "Soap and water", "New examination gloves"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "When should disposable examination gloves be changed?", "why": "Single-use examination gloves are not reusable.", "options": ["Once per workday", "Only when heavily stained", "After being washed for reuse", "Between patients"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What does a surgical mask primarily protect during splash-producing procedures?", "why": "A surgical mask provides a barrier for the nose and mouth.", "options": ["Nose and mouth against droplets and splashes", "Hands from contaminated surfaces", "Instruments from corrosion", "The entire room from radiation"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is appropriate when eye splashes are possible?", "why": "Protective glasses or a face shield reduce mucous membrane exposure.", "options": ["A hair cap only", "Protective eyewear", "No protection if the patient is healthy", "A surgical gown only"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What is the role of a face shield?", "why": "A face shield provides additional splash protection.", "options": ["It sterilizes the air", "It replaces hand cleaning", "It supplements other indicated PPE", "It always replaces the mask"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Where must used needles be discarded?", "why": "Dispose of sharps immediately in an appropriate container.", "options": ["Ordinary trash", "A paper bag", "A sterilization pouch", "A puncture-resistant sharps container"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "How should a used needle normally be handled?", "why": "Two-handed recapping creates needlestick risk.", "options": ["Avoid recapping using two hands", "Bend it before disposal", "Break it by hand", "Carry it in a pocket"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is the first action after a needlestick injury?", "why": "Prompt reporting allows assessment and appropriate post-exposure care.", "options": ["Ignore it if there is no bleeding", "Provide immediate first aid and report the exposure", "Continue working without reporting", "Apply disinfectant inside the wound"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "Which item is classified as critical in the Spaulding scheme?", "why": "Critical instruments require sterilization.", "options": ["The dental chair armrest", "An intact-skin blood pressure cuff", "A surgical instrument entering sterile tissue", "A waiting room table"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Which item commonly requires heat sterilization between patients?", "why": "Heat-tolerant reusable patient-care instruments should be sterilized.", "options": ["A disposable paper towel", "A computer monitor", "A waiting room chair", "Reusable dental forceps"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What should happen before instruments are sterilized?", "why": "Cleaning removes material that can interfere with sterilization.", "options": ["Thorough cleaning", "Painting the instruments", "Using perfume", "Packaging them while visibly dirty"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is the preferred sterilization method for heat-tolerant dental instruments?", "why": "Steam sterilization is widely recommended for suitable instruments.", "options": ["Wiping with alcohol", "Steam under pressure in an autoclave", "Cold water immersion", "Sunlight exposure"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What does a biological indicator assess?", "why": "Spore tests help assess sterilization efficacy.", "options": ["The color of the instrument tray", "The room temperature alone", "The sterilization process using resistant spores", "The age of the autoclave"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "What does an internal chemical indicator show?", "why": "Chemical indicators monitor exposure conditions, not complete sterility by themselves.", "options": ["That every organism is necessarily dead", "That the instrument was never used", "That gloves are sterile", "That a package was exposed to specified process conditions"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "How should sterile instrument packages be stored?", "why": "Proper storage preserves package integrity.", "options": ["Clean, dry, protected from damage", "Open on a countertop", "Under a leaking sink", "Beside unsealed waste bags"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What should be done with a torn sterile pouch?", "why": "Compromised packaging cannot maintain sterility.", "options": ["Use it if instruments look clean", "Reprocess the contents before use", "Tape the tear and proceed", "Spray it with perfume"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What is the difference between cleaning and disinfection?", "why": "These are different steps with different objectives.", "options": ["Both always remove bacterial spores", "Cleaning uses radiation only", "Cleaning removes soil; disinfection reduces or destroys many pathogens", "Disinfection always substitutes for sterilization"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Which surfaces need attention between patients?", "why": "Clinical contact surfaces can transfer contamination.", "options": ["Only the waiting room floor", "Only exterior windows", "Only walls once per year", "Frequently touched clinical contact surfaces"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What should be done if a surface is visibly contaminated with blood?", "why": "Cleaning and appropriate disinfection reduce contamination.", "options": ["Clean it and disinfect according to protocol", "Cover it with paper and ignore it", "Rinse it with plain water only", "Wait until the next day"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "Why are dental unit waterlines managed?", "why": "Waterlines may develop biofilm without proper management.", "options": ["To increase X-ray resolution", "To control microbial contamination and biofilm", "To sterilize metal instruments", "To eliminate the need for hand hygiene"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What is recommended for surgical irrigation into sterile tissue?", "why": "Surgical irrigation requires sterile fluid where indicated.", "options": ["Untreated dental unit water", "Water from a decorative fountain", "Sterile irrigating solution delivered appropriately", "Nonsterile tap water in every case"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "When is respiratory protection such as an N95 needed?", "why": "Respirators are selected according to airborne hazard and applicable protocol.", "options": ["For every administrative phone call", "Only when using a computer", "Instead of all other protection", "When indicated by airborne infection risk assessment"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "How should PPE be removed?", "why": "Careful doffing and hand hygiene reduce transfer of contaminants.", "options": ["To minimize self-contamination", "By touching contaminated fronts freely", "Only after going home", "Without cleaning hands afterward"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is the purpose of instrument packaging?", "why": "Compatible packaging protects processed instruments.", "options": ["Replace cleaning", "Maintain sterility after processing until use", "Make instruments sharper", "Eliminate the sterilization cycle"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What does a sterilizer cycle record help document?", "why": "Documenting cycles supports quality assurance.", "options": ["Patient height only", "Clinic advertising results", "Process parameters and traceability", "X-ray beam energy"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "If a sterilizer fails its biological monitoring, what is appropriate?", "why": "Failed monitoring requires prompt investigation and corrective action.", "options": ["Ignore the failed result", "Increase office lighting", "Use all loads immediately", "Follow the failure protocol and investigate before reuse"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What is the appropriate use of disposable suction tips?", "why": "Single-use items should not be reprocessed for routine reuse.", "options": ["Use once and discard as directed", "Wash and reuse indefinitely", "Share between patients without processing", "Keep in a pocket for later"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "Which strategy reduces cross-contamination from keyboards?", "why": "Frequently handled equipment needs contamination control.", "options": ["Only wash the chair", "Use barriers or appropriate cleaning and disinfection", "Keep contaminated gloves on all day", "Ignore touch surfaces"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "When should a visibly soiled gown be changed?", "why": "Contaminated protective clothing should be managed promptly.", "options": ["Only annually", "Only after changing employers", "Promptly, following protocol", "Never if gloves are worn"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Why is vaccination of dental healthcare workers important?", "why": "Immunization is part of occupational infection prevention.", "options": ["It replaces instrument sterilization", "It eliminates every occupational hazard", "It sterilizes contaminated needles", "It lowers risk from vaccine-preventable infections"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "Which pathogen is a major occupational bloodborne concern?", "why": "HBV can be transmitted through blood exposure.", "options": ["Hepatitis B virus", "Common pollen", "Dental composite powder", "Normal room dust"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "Can a patient without symptoms transmit an infection?", "why": "Standard precautions account for unrecognized infections.", "options": ["No, symptoms are always present", "Yes, infection can be asymptomatic", "Only if the patient is a child", "Only in winter"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What should be done before touching a clean supply with contaminated gloves?", "why": "Contaminated gloves can transfer microorganisms.", "options": ["Touch it quickly", "Spray gloves with fragrance", "Remove gloves and perform hand hygiene as indicated", "Put used gloves over fresh gloves"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "What is an aerosol-generating procedure concern?", "why": "Exposure controls depend on procedure and infectious risk.", "options": ["Elimination of every biological hazard", "Guaranteed sterility of instruments", "Instant disinfection of the operatory", "Potential inhalation or deposition of infectious particles"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "Which measure may reduce contamination during aerosol-generating treatment?", "why": "High-volume evacuation can help reduce droplets and aerosols at the source.", "options": ["Appropriate high-volume evacuation", "Turning off all suction", "Reusing disposable masks", "Removing ventilation"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is the purpose of a rubber dam when appropriate?", "why": "Rubber dams can improve isolation during selected procedures.", "options": ["Replace sterilization", "Isolate the operative field and help limit contamination", "Shield against all ionizing radiation", "Make gloves unnecessary"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "Why should instruments be transported in a closed container?", "why": "Secure transport helps protect staff and the environment.", "options": ["To make them automatically sterile", "To avoid recording sterilization cycles", "To reduce spills and occupational exposure", "To disinfect them in transit"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "What does an exposure control plan address?", "why": "Exposure plans organize preventive and response practices.", "options": ["The clinic marketing budget", "Dental insurance only", "Patient parking", "Procedures to prevent and manage occupational exposure"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "Why are safety-engineered sharps helpful?", "why": "Engineering controls can reduce occupational injuries.", "options": ["They can reduce sharps injuries when appropriately used", "They sterilize contaminated blood", "They remove the need for training", "They permit recapping with both hands"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What should be checked before using a packaged sterilized instrument?", "why": "A damaged or improperly processed package should not be used.", "options": ["The price sticker only", "Package integrity and relevant processing indicators", "The patient's handwriting", "The room music volume"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What is the purpose of intermediate-level disinfection where indicated?", "why": "Disinfectant selection must match surface risk and product instructions.", "options": ["Guarantee sterilization of surgical instruments", "Replace PPE", "Inactivate relevant pathogens on compatible surfaces", "Make dirty surfaces visibly clean without prior cleaning"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Why must disinfectant contact time be respected?", "why": "Shortened contact time can undermine disinfection.", "options": ["It changes the patient's blood type", "It raises X-ray contrast", "It is optional for all products", "The surface needs the specified wet exposure time"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What is appropriate for reusable impression materials or devices?", "why": "Dental materials require compatible procedures.", "options": ["Follow material-compatible validated cleaning and disinfection instructions", "Always discard every reusable item", "Skip decontamination because impressions are dry", "Use any solvent without checking compatibility"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is a key rule for handwashing?", "why": "Technique and sufficient duration improve hand hygiene.", "options": ["Wash gloves instead of hands", "Clean all hand surfaces for the recommended duration", "Use water only after every procedure", "Skip thumbs and fingertips"], "answer": 1}, {"topic": "Infection Prevention and Control", "q": "What is the role of a designated dirty-to-clean workflow?", "why": "Separating contaminated and clean areas helps prevent cross-contamination.", "options": ["Increase patient radiation dose", "Replace every storage cabinet", "Prevent recontamination of processed instruments", "Eliminate documentation"], "answer": 2}, {"topic": "Infection Prevention and Control", "q": "Why is staff training necessary?", "why": "Training supports safe implementation of protocols.", "options": ["It sterilizes the room by itself", "It eliminates all need for audits", "It makes disinfectants unnecessary", "It supports correct and consistent infection-control practice"], "answer": 3}, {"topic": "Infection Prevention and Control", "q": "What is the correct approach to infectious waste?", "why": "Safe waste management reduces exposure risks.", "options": ["Segregate and dispose of it according to applicable rules", "Put all waste in recycling", "Store used sharps in pockets", "Leave it in treatment rooms indefinitely"], "answer": 0}, {"topic": "Infection Prevention and Control", "q": "What is the overall aim of dental infection prevention?", "why": "Infection prevention safeguards everyone involved in care.", "options": ["Avoid every clinical examination", "Protect patients and personnel from transmission", "Make all radiographs unnecessary", "Replace oral diagnosis"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does ALARA stand for?", "why": "ALARA is a core principle of radiation protection optimization.", "options": ["Always Large And Rapidly Applied", "Automatic Light And Radiation Adjustment", "As Low As Reasonably Achievable", "All Levels Are Risk-free Always"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "What type of radiation is used in dental radiography?", "why": "Dental X-ray imaging uses ionizing electromagnetic radiation.", "options": ["Ultrasound only", "Infrared light only", "Visible blue light only", "Ionizing X-rays"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "When should a dental radiograph be prescribed?", "why": "Radiography should be clinically justified.", "options": ["When justified by individual clinical need", "At every visit regardless of need", "Only because equipment is available", "Only to fill the schedule"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What helps reduce patient dose in intraoral radiography?", "why": "Rectangular collimation can reduce irradiated tissue and dose.", "options": ["Unnecessary repeat exposures", "Rectangular collimation when feasible", "A larger-than-needed beam", "Increasing exposure time routinely"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is the purpose of collimation?", "why": "Limiting field size reduces unnecessary exposure.", "options": ["Increase scattered radiation", "Sterilize the receptor", "Restrict the X-ray beam to the area of interest", "Replace patient positioning"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "What can digital image receptors provide?", "why": "Proper digital techniques can help optimize exposure.", "options": ["Zero radiation in every exam", "Automatic elimination of motion", "A guarantee that repeats never occur", "Diagnostic images at potentially lower doses when correctly used"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "Where should the operator stand during exposure?", "why": "Protective barriers reduce occupational exposure.", "options": ["Behind an appropriate protective barrier", "Directly in the primary beam", "Holding the tubehead", "Beside the patient's mouth without protection"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is the inverse square law?", "why": "Increasing distance markedly reduces intensity from a point source.", "options": ["Dose increases with the square of distance", "Intensity decreases with the square of distance", "Exposure is independent of distance", "Distance only changes image color"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What should staff avoid during exposure?", "why": "Personnel should not manually hold intraoral receptors during exposure.", "options": ["Positioning the patient beforehand", "Using approved barriers", "Holding the image receptor in the patient's mouth", "Checking the prescription"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is the purpose of a position-indicating device?", "why": "A properly aligned device supports accurate exposure geometry.", "options": ["Disinfect the sensor", "Interpret the radiograph automatically", "Replace shielding design", "Help align and direct the X-ray beam"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "What commonly causes a cone-cut artifact?", "why": "Part of the receptor is outside the useful X-ray field.", "options": ["Misalignment between the beam and image receptor", "Too many patient records", "Waterline biofilm", "Excessive room ventilation"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does image elongation often indicate?", "why": "Projection geometry affects tooth length in the image.", "options": ["Low monitor brightness only", "Incorrect vertical angulation", "A broken printer cable", "Insufficient infection-control supplies"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does foreshortening often indicate?", "why": "Excessive angulation can make structures look shortened.", "options": ["Too little hand soap", "A damaged sharps container", "Excessive vertical angulation", "A mislabeled appointment"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "Why is the paralleling technique widely preferred?", "why": "Paralleling helps improve dimensional accuracy.", "options": ["It makes X-rays nonionizing", "It eliminates all positioning errors", "It sterilizes the sensor", "It helps limit geometric distortion"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is a bitewing radiograph particularly useful for?", "why": "Bitewings support assessment of proximal surfaces and bone levels.", "options": ["Detecting interproximal caries and evaluating crestal bone", "Imaging the entire skull", "Measuring blood pressure", "Sterilizing dental calculus"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is a periapical radiograph intended to show?", "why": "Periapical views visualize roots and surrounding bone.", "options": ["Only the soft palate", "The tooth and surrounding periapical region", "Only the tongue surface", "The whole thorax"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does a panoramic radiograph provide?", "why": "Panoramic images cover broad anatomy but have limitations.", "options": ["The same fine detail as every intraoral view", "A completely distortion-free image", "A broad overview of jaws and dentition", "An image without positioning requirements"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "When might CBCT be appropriate?", "why": "CBCT should be selected based on expected diagnostic benefit and dose.", "options": ["For all checkups by default", "Whenever a two-dimensional image is sufficient", "To avoid all radiation", "For a justified three-dimensional clinical question"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "Compared with routine intraoral images, CBCT generally involves:", "why": "Dose varies substantially by field of view and technique.", "options": ["A potentially greater radiation dose depending on protocol", "No radiation dose", "Only visible light", "No requirement for justification"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is the benefit of a smaller CBCT field of view when adequate?", "why": "Limit scan coverage to the diagnostic task.", "options": ["It guarantees a perfect diagnosis", "It limits the region irradiated", "It removes all artifacts", "It increases unnecessary coverage"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What causes scattered radiation?", "why": "Scatter can expose nearby staff and degrade contrast.", "options": ["Battery charging alone", "Opening a sterile pouch", "Interactions of the primary beam with matter", "Handwashing"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "Why should unnecessary repeat radiographs be avoided?", "why": "Correct technique helps avoid avoidable exposure.", "options": ["They always improve image quality", "They reduce cumulative dose", "They replace clinical history", "They add radiation exposure without needed benefit"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "What commonly causes motion blur?", "why": "Patient or equipment motion can reduce image sharpness.", "options": ["Movement during image acquisition", "A sterile instrument pouch", "An extra face shield", "Correct collimation alone"], "answer": 0}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is radiographic contrast?", "why": "Contrast helps distinguish anatomical structures.", "options": ["The physical size of the dental chair", "Difference in image intensity between structures", "The number of staff on duty", "The sterilizer cycle length"], "answer": 1}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does radiopacity usually look like on a dental radiograph?", "why": "More X-ray attenuation generally produces a lighter appearance.", "options": ["Completely invisible", "Always green", "Lighter or whiter", "Always red"], "answer": 2}, {"topic": "Dental Radiology and Radiation Safety", "q": "What does radiolucency usually look like?", "why": "Radiolucent structures attenuate fewer X-rays and tend to appear dark.", "options": ["Whiter than metal", "Fluorescent blue", "Bright orange", "Darker"], "answer": 3}, {"topic": "Dental Radiology and Radiation Safety", "q": "What is exposure time?", "why": "E const letters=['A','B','C','D'];const root=document.querySelector('#quiz');let graded=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
QUESTIONS.forEach((q,i)=>{let d=document.createElement('section');d.className='question';d.id='q'+i;d.innerHTML=`<span class="meta">Question ${i+1} of 100 · ${esc(q.topic)}</span><h3>${esc(q.q)}</h3>${q.options.map((o,k)=>`<label class="option" id="opt-${i}-${k}"><input type="radio" name="q${i}" value="${k}"> <span><strong>${letters[k]})</strong> ${esc(o)}</span></label>`).join('')}<div class="answer" id="ex${i}"><strong>Correct answer: ${letters[q.answer]}) ${esc(q.options[q.answer])}</strong><br>${esc(q.why)}</div>`;root.append(d)});
const selections=()=>QUESTIONS.map((_,i)=>{let v=document.querySelector('input[name="q'+i+'"]:checked');return v?Number(v.value):null});
function update(){let n=selections().filter(v=>v!==null).length;document.querySelector('#bar').style.width=n+'%';document.querySelector('#progresslabel').textContent=`${n} of 100 answered`;document.querySelector('#footprogress').innerHTML=`<strong>${n}/100</strong> answered`;}
root.addEventListener('change',update);
function correct(){if(graded)return;let ans=selections();let missing=ans.filter(v=>v===null).length;if(missing&&!confirm(`There are ${missing} unanswered questions. Grade anyway?`))return;graded=true;let hits=0;QUESTIONS.forEach((q,i)=>{if(ans[i]===q.answer)hits++;document.querySelector('#ex'+i).style.display='block';document.querySelector('#opt-'+i+'-'+q.answer).classList.add('right');if(ans[i]!==null&&ans[i]!==q.answer)document.querySelector('#opt-'+i+'-'+ans[i]).classList.add('wrong');document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.disabled=true)});let pct=hits;document.querySelector('#scorenumber').textContent=`${hits} correct out of 100 (${pct}%)`;document.querySelector('#scoretext').textContent=`Infection control: ${QUESTIONS.slice(0,50).filter((q,i)=>ans[i]===q.answer).length}/50 · Radiology: ${QUESTIONS.slice(50).filter((q,i)=>ans[i+50]===q.answer).length}/50. Answers and explanations appear below.`;document.querySelector('#result').style.display='block';document.querySelector('#correct').disabled=true;document.querySelector('#result').scrollIntoView({behavior:'smooth'});}
document.querySelector('#correct').onclick=correct;
document.querySelector('#save').onclick=()=>{try{localStorage.setItem('dental-quiz-100-en-v1',JSON.stringify({name:document.querySelector('#student').value,answers:selections()}));alert('Answers saved in this browser.')}catch(e){alert('Saving is unavailable in this browser. Keep the file open or try another browser.')}};
document.querySelector('#reset').onclick=()=>{if(confirm('Clear all answers and restart?')){try{localStorage.removeItem('dental-quiz-100-en-v1')}catch(e){}location.reload()}};
document.querySelector('#print').onclick=()=>window.print();
document.querySelector('#top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.querySelector('#reviewwrong').onclick=()=>{let a=selections();let n=QUESTIONS.findIndex((q,i)=>a[i]!==q.answer);if(n>=0)document.querySelector('#q'+n).scrollIntoView({behavior:'smooth'});else alert('No incorrect answers!')};
document.querySelector('#reviewall').onclick=()=>document.querySelector('#q0').scrollIntoView({behavior:'smooth'});
try{let saved=JSON.parse(localStorage.getItem('dental-quiz-100-en-v1')||'null');if(saved&&Array.isArray(saved.answers)){document.querySelector('#student').value=saved.name||'';saved.answers.forEach((v,i)=>{if(v!==null&&v>=0&&v<4){let e=document.querySelector(`input[name="q${i}"][value="${v}"]`);if(e)e.checked=true}})}}catch(e){}update();
</script></body></html>
